<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE MANUSCRIPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet" />

  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #000000;
      --panel:        #000000;
      --panel-hover:  #141e35;
      --border:       #1e2d50;
      --accent:       #4a9eff;
      --accent-dim:   #1e4a8a;
      --text:         #d8d0bc;
      --text-dim:     #7a7260;
      --text-faint:   #3a3828;
      --paper:        #c8bfa8;
      --red:          #c0392b;
      --sidebar-w:    260px;
      --header-h:     54px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.75;
      overflow: hidden;
    }

    /* ── BLUEPRINT GRID (signature element) ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px),
        linear-gradient(rgba(74,158,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,158,255,0.03) 1px, transparent 1px);
      background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
      opacity: 0.45;
    }

    /* ── SCANLINE OVERLAY ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.06) 2px,
        rgba(0,0,0,0.06) 4px
      );
    }

    /* ── LAYOUT SHELL ── */
    #shell {
      position: relative;
      z-index: 1;
      display: flex;
      height: 100vh;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: width 0.3s ease;
      position: relative;
    }

    #sidebar.collapsed {
      width: 48px;
    }

    .sidebar-header {
      height: var(--header-h);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
    }

    .sidebar-label {
      font-family: 'Special Elite', serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.2s;
    }

    #sidebar.collapsed .sidebar-label { opacity: 0; }

    .toggle-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s, color 0.2s;
      font-size: 12px;
      line-height: 1;
    }

    .toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* chapter list */
    #chapter-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 0;
    }

    #chapter-list::-webkit-scrollbar { width: 4px; }
    #chapter-list::-webkit-scrollbar-thumb { background: var(--border); }

    .chapter-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 14px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
      overflow: hidden;
    }

    .chapter-item:hover {
      background: var(--panel-hover);
    }

    .chapter-item.active {
      border-left-color: var(--accent);
      background: var(--panel-hover);
    }

    .ch-num {
      font-size: 10px;
      color: var(--accent-dim);
      letter-spacing: 0.1em;
      padding-top: 2px;
      flex-shrink: 0;
      font-family: 'Courier Prime', monospace;
    }

    .chapter-item.active .ch-num { color: var(--accent); }

    .ch-title {
      font-size: 12px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
      transition: color 0.15s;
    }

    .chapter-item:hover .ch-title,
    .chapter-item.active .ch-title { color: var(--text); }

    /* sidebar footer */
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 12px;
      flex-shrink: 0;
    }

    .add-chapter-btn {
      width: 100%;
      background: none;
      border: 1px dashed var(--accent-dim);
      color: var(--accent-dim);
      font-family: 'Courier Prime', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 8px 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      white-space: nowrap;
      overflow: hidden;
    }

    .add-chapter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(74,158,255,0.04);
    }

    .add-chapter-btn .btn-text {
      opacity: 1;
      transition: opacity 0.2s;
    }

    #sidebar.collapsed .add-chapter-btn .btn-text { opacity: 0; width: 0; overflow: hidden; }
    #sidebar.collapsed .add-chapter-btn { justify-content: center; }

    /* ── MAIN AREA ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* top bar */
    #topbar {
      height: var(--header-h);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 16px;
      flex-shrink: 0;
    }

    .doc-title {
      font-family: 'Special Elite', serif;
      font-size: 14px;
      letter-spacing: 0.12em;
      color: var(--paper);
      flex: 1;
    }

    .meta-tag {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-faint);
      text-transform: uppercase;
      border: 1px solid var(--text-faint);
      padding: 2px 7px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── CONTENT AREA ── */
    #content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 48px 60px 80px;
    }

    #content::-webkit-scrollbar { width: 6px; }
    #content::-webkit-scrollbar-thumb { background: var(--border); }

    /* page wrapper */
    .page {
      display: none;
      max-width: 720px;
    }

    .page.active { display: block; }

    /* chapter heading */
    .chapter-heading {
      margin-bottom: 40px;
    }

    .ch-eyebrow {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ch-eyebrow::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--accent-dim);
      max-width: 120px;
      opacity: 0.4;
    }

    .chapter-title {
      font-family: 'Special Elite', serif;
      font-size: 32px;
      line-height: 1.25;
      color: var(--paper);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .chapter-subtitle {
      font-size: 13px;
      color: var(--text-dim);
      font-style: italic;
    }

    /* body text */
    .prose p {
      margin-bottom: 22px;
      color: var(--text);
    }

    .prose p:first-child::first-letter {
      font-family: 'Special Elite', serif;
      font-size: 3em;
      line-height: 0.8;
      float: left;
      margin-right: 8px;
      margin-top: 4px;
      color: var(--paper);
    }
    .prose2 p {
      margin-bottom: 22px;
      color: var(--text);
    }

    /* inline annotation */
    .annotation {
      border-left: 2px solid var(--accent-dim);
      padding: 12px 18px;
      margin: 28px 0;
      background: rgba(74,158,255,0.03);
    }

    .annotation p {
      font-size: 13px;
      color: var(--text-dim);
      margin: 0;
    }

    .annotation p::before {
      content: '// ';
      color: var(--accent-dim);
    }

    /* field / spec line */
    .spec-block {
      margin: 28px 0;
      border: 1px solid var(--border);
      padding: 18px 22px;
    }

    .spec-row {
      display: flex;
      gap: 20px;
      padding: 6px 0;
      border-bottom: 1px solid var(--text-faint);
      font-size: 12px;
    }

    .spec-row:last-child { border-bottom: none; }

    .spec-key {
      color: var(--text-dim);
      letter-spacing: 0.08em;
      min-width: 140px;
      flex-shrink: 0;
    }

    .spec-val { color: var(--paper); }

    /* blinking cursor */
    .cursor {
      display: inline-block;
      width: 9px;
      height: 16px;
      background: var(--accent);
      vertical-align: middle;
      margin-left: 3px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 36px 0;
      color: var(--text-faint);
      font-size: 11px;
      letter-spacing: 0.2em;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── TYPEWRITER ANIMATION ── */
    @keyframes typeIn {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0% 0 0); }
    }

    .page.active .chapter-title {
      animation: typeIn 0.6s steps(30, end) both;
    }

    /* ── MODAL: ADD CHAPTER ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8,12,24,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #modal-overlay.open { display: flex; }

    #modal {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 32px 36px;
      min-width: 360px;
      position: relative;
    }

    #modal h2 {
      font-family: 'Special Elite', serif;
      font-size: 16px;
      color: var(--paper);
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }

    #modal label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    #modal input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Courier Prime', monospace;
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    #modal input:focus { border-color: var(--accent); }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'Courier Prime', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      padding: 7px 16px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }

    .btn-primary {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Courier Prime', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      padding: 7px 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover { background: rgba(74,158,255,0.25); }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      :root { --sidebar-w: 220px; }
      #content { padding: 32px 24px 60px; }
      .chapter-title { font-size: 24px; }
    }
  </style>
</head>
<body>

<div id="shell">

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <button class="toggle-btn" id="toggleBtn" title="Toggle sidebar" aria-label="Toggle sidebar">&#x2630;</button>
      <span class="sidebar-label">Chapters</span>
    </div>

    <div id="chapter-list">
      <!-- populated by JS -->
    </div>

    <div class="sidebar-footer">
      <button class="add-chapter-btn" id="addChapterBtn">
        <span>+</span>
        <span class="btn-text">New Chapter</span>
      </button>
    </div>
  </nav>

  <!-- MAIN -->
  <div id="main">
    <header id="topbar">
      <span class="doc-title">THE MANUSCRIPT</span>
      <span class="meta-tag">DRAFT 01</span>
      <span class="meta-tag" id="chapterCount">— ch</span>
      <div class="status-dot" title="Live"></div>
    </header>

    <div id="content">
      <!-- pages rendered by JS -->
    </div>
  </div>

</div>

<!-- ADD CHAPTER MODAL -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div id="modal">
    <h2 id="modal-title">// NEW CHAPTER</h2>
    <label for="ch-title-input">Chapter Title</label>
    <input id="ch-title-input" type="text" placeholder="Enter title..." maxlength="60" autocomplete="off" />
    <label for="ch-sub-input">Subtitle <span style="opacity:.4">(optional)</span></label>
    <input id="ch-sub-input" type="text" placeholder="A brief description..." maxlength="80" autocomplete="off" />
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelBtn">CANCEL</button>
      <button class="btn-primary" id="confirmBtn">ADD CHAPTER</button>
    </div>
  </div>
</div>

<script>
  // ── DATA ──────────────────────────────────────────────────────────────
  const chapters = [
  {
      id: '0.1',
      num: '0.1',
      title: 'quick-fix',
      subtitle: 'random quick throw bullshit',
      content:''
      },
    {
      id: '1.1',
      num: '1.1',
      title: 'Core open-ended questions & Follow Ups',
      subtitle: 'The girl should reveal more personal things about herself. So she feels more comfortable around you.',
      content: `
    <div class="prose">
      <p>Conversation is not a performance — it is an excavation. The questions that matter are not the ones that fill silence, but the ones that make someone feel, for a moment, genuinely found. </div>

    <div class="divider">§</div>

    <div class="spec-block">
      <div class="spec-row"><span class="spec-key">CHILDHOOD &amp; BACKGROUND</span><span class="spec-val">18 questions</span></div>
      <div class="spec-row"><span class="spec-key">01</span><span class="spec-val"><b>What's something about the place you grew up that most outsiders would never guess? </b>→ Ask what they miss most about it, or what they were glad to leave behind.</span></div>
      <div class="spec-row"><span class="spec-key">02</span><span class="spec-val"><b>Who was the most memorable teacher you ever had, and what made them stick with you? </b>→ Follow up on whether that person changed how they see things today.</span></div>
      <div class="spec-row"><span class="spec-key">03</span><span class="spec-val"><b>What did you spend most of your free time doing as a kid? </b>→ Ask if they ever tried to get back into it as an adult.</span></div>
      <div class="spec-row"><span class="spec-key">04</span><span class="spec-val"><b>What's a family tradition from your childhood that felt totally normal until you realized other families didn't do it? </b>→ Ask if they've kept it going or let it fade.</span></div>
      <div class="spec-row"><span class="spec-key">05</span><span class="spec-val"><b>What's the earliest memory you have that still feels vivid? </b>→ Ask what they think made it stick so clearly.</span></div>
      <div class="spec-row"><span class="spec-key">06</span><span class="spec-val"><b>What did you want to be when you grew up at age 10 — and how did that change by the time you were 18? </b>→ Ask what pulled them away from the original dream.</span></div>
      <div class="spec-row"><span class="spec-key">07</span><span class="spec-val"><b>Who were you closest to in your family growing up? </b>→ Ask how that relationship has evolved over the years.</span></div>
      <div class="spec-row"><span class="spec-key">08</span><span class="spec-val"><b>What's the most trouble you ever got into as a kid? </b>→ Ask if they'd handle it differently now.</span></div>
      <div class="spec-row"><span class="spec-key">09</span><span class="spec-val"><b>What's something your parents were really strict about that you now either totally agree with or completely disagree with? </b>→ Ask if their view shifted gradually or all at once.</span></div>
      <div class="spec-row"><span class="spec-key">10</span><span class="spec-val"><b>What's a book, movie, or TV show from your childhood that genuinely shaped how you see the world? </b>→ Ask what specifically landed differently when they revisited it as an adult.</span></div>
      <div class="spec-row"><span class="spec-key">11</span><span class="spec-val"><b>What part of your hometown do you think about more than you'd expect? </b>→ Ask what draws their mind back to that specific thing.</span></div>
      <div class="spec-row"><span class="spec-key">12</span><span class="spec-val"><b>Were you more of an introvert or extrovert as a kid, and do you think that's changed? </b>→ Ask what they think caused any shift.</span></div>
      <div class="spec-row"><span class="spec-key">13</span><span class="spec-val"><b>What's something you taught yourself as a teenager that no one else knew you were learning? </b>→ Ask what pushed them to learn it on their own.</span></div>
      <div class="spec-row"><span class="spec-key">14</span><span class="spec-val"><b>What's the most formative trip or adventure you had growing up? </b>→ Ask if they've been back since or thought about going.</span></div>
      <div class="spec-row"><span class="spec-key">15</span><span class="spec-val"><b>What's a value your family held that you've completely made your own — and one you've quietly let go of? </b>→ Ask if there was a specific moment they realized they'd changed their mind.</span></div>
      <div class="spec-row"><span class="spec-key">16</span><span class="spec-val"><b>What did you think adulthood would feel like, and how does the reality compare? </b>→ Ask which part surprised them the most.</span></div>
      <div class="spec-row"><span class="spec-key">17</span><span class="spec-val"><b>What's the most random skill or hobby you picked up as a kid that's come in handy in some unexpected way? </b>→ Ask if they still use it at all.</span></div>
      <div class="spec-row"><span class="spec-key">18</span><span class="spec-val"><b>What was your friendship group like growing up — and how different is who you're close to now? </b>→ Ask if they stay in touch with anyone from back then.</span></div>
    </div>

    <div class="divider">§</div>

    <div class="spec-block">
      <div class="spec-row"><span class="spec-key">WORK &amp; AMBITION</span><span class="spec-val">18 questions</span></div>
      <div class="spec-row"><span class="spec-key">01</span><span class="spec-val"><b>What was the moment you realized your career was actually heading somewhere? </b>→ Ask what was happening in your life around that same time.</span></div>
      <div class="spec-row"><span class="spec-key">02</span><span class="spec-val"><b>What's the part of your job that nobody outside your field would understand? </b>→ Ask how they usually explain what they do at parties.</span></div>
      <div class="spec-row"><span class="spec-key">03</span><span class="spec-val"><b>What's a skill you've built at work that surprised even you? </b>→ Ask if they see it being useful outside their job.</span></div>
      <div class="spec-row"><span class="spec-key">04</span><span class="spec-val"><b>Who's the most influential person you've had as a mentor or boss, and what made them different? </b>→ Ask what one thing they said that stayed with them.</span></div>
      <div class="spec-row"><span class="spec-key">05</span><span class="spec-val"><b>What would your 22-year-old self think of what you do now? </b>→ Ask if that reaction would be pride, confusion, or something else.</span></div>
      <div class="spec-row"><span class="spec-key">06</span><span class="spec-val"><b>What's the most uncomfortable decision you've had to make at work? </b>→ Ask how they knew they made the right call.</span></div>
      <div class="spec-row"><span class="spec-key">07</span><span class="spec-val"><b>What does ambition actually look like to you — how do you define it for yourself? </b>→ Ask if they think of themselves as ambitious.</span></div>
      <div class="spec-row"><span class="spec-key">08</span><span class="spec-val"><b>What's a total career failure you had that ended up mattering more than you expected? </b>→ Ask what it took to see that failure differently.</span></div>
      <div class="spec-row"><span class="spec-key">09</span><span class="spec-val"><b>If you could swap industries for a year with no consequences, what would you try? </b>→ Ask what they think they'd be surprisingly good at.</span></div>
      <div class="spec-row"><span class="spec-key">10</span><span class="spec-val"><b>What's the gap between what you tell people you do and what you actually do all day? </b>→ Ask which parts they'd never want to give up.</span></div>
      <div class="spec-row"><span class="spec-key">11</span><span class="spec-val"><b>What does success feel like for you — what does it actually look like on a day-to-day basis? </b>→ Ask if that definition has shifted over time.</span></div>
      <div class="spec-row"><span class="spec-key">12</span><span class="spec-val"><b>What's something you were told you'd never be good at that you've actually gotten really good at? </b>→ Ask what pushed them to keep going anyway.</span></div>
      <div class="spec-row"><span class="spec-key">13</span><span class="spec-val"><b>What's the part of your work that doesn't show up on a résumé but that you're most proud of? </b>→ Ask if anyone has noticed or acknowledged it.</span></div>
      <div class="spec-row"><span class="spec-key">14</span><span class="spec-val"><b>What would you work on if you knew it couldn't fail but also might not pay well? </b>→ Ask what's stopping them from doing more of that now.</span></div>
      <div class="spec-row"><span class="spec-key">15</span><span class="spec-val"><b>What's the best piece of career advice you've gotten — and what's the worst? </b>→ Ask who gave them each one.</span></div>
      <div class="spec-row"><span class="spec-key">16</span><span class="spec-val"><b>How much does what you do for work feel like who you are? </b>→ Ask when that relationship started to feel that way.</span></div>
      <div class="spec-row"><span class="spec-key">17</span><span class="spec-val"><b>What's something you're working toward right now that most people in your life don't know about? </b>→ Ask what made them decide to keep it quiet.</span></div>
      <div class="spec-row"><span class="spec-key">18</span><span class="spec-val"><b>What's the last time work genuinely energized you rather than just tired you out? </b>→ Ask what was different about that moment.</span></div>
    </div>

    <div class="divider">§</div>

    <div class="spec-block">
      <div class="spec-row"><span class="spec-key">HOBBIES &amp; PASSIONS</span><span class="spec-val">18 questions</span></div>
      <div class="spec-row"><span class="spec-key">01</span><span class="spec-val"><b>What's something you do just for yourself that has nothing to do with being productive? </b>→ Ask how they found their way into it.</span></div>
      <div class="spec-row"><span class="spec-key">02</span><span class="spec-val"><b>What's a hobby or interest you've had forever that you feel like most people underestimate? </b>→ Ask how they'd convince a skeptic to try it.</span></div>
      <div class="spec-row"><span class="spec-key">03</span><span class="spec-val"><b>What's the thing you can spend three hours on and lose track of time completely? </b>→ Ask when they last had a day that felt like that.</span></div>
      <div class="spec-row"><span class="spec-key">04</span><span class="spec-val"><b>What's a creative outlet that surprised you by how much you ended up loving it? </b>→ Ask what made them try it in the first place.</span></div>
      <div class="spec-row"><span class="spec-key">05</span><span class="spec-val"><b>What's a skill you're actively trying to get better at right now? </b>→ Ask what pushed them to start.</span></div>
      <div class="spec-row"><span class="spec-key">06</span><span class="spec-val"><b>What's a passion of yours that's really hard to explain to someone who doesn't share it? </b>→ Ask them to try to sell you on it right now.</span></div>
      <div class="spec-row"><span class="spec-key">07</span><span class="spec-val"><b>What's something you used to love doing that you've drifted away from — and do you miss it? </b>→ Ask what got in the way.</span></div>
      <div class="spec-row"><span class="spec-key">08</span><span class="spec-val"><b>How do you recharge when you've had a really draining week? </b>→ Ask if that's always been the thing that works for them.</span></div>
      <div class="spec-row"><span class="spec-key">09</span><span class="spec-val"><b>What's a hobby you picked up during a weird or difficult period in your life that stuck? </b>→ Ask how that period changed what you needed out of it.</span></div>
      <div class="spec-row"><span class="spec-key">10</span><span class="spec-val"><b>What's something you're weirdly knowledgeable about that has nothing to do with your job? </b>→ Ask how deep that rabbit hole goes.</span></div>
      <div class="spec-row"><span class="spec-key">11</span><span class="spec-val"><b>What's the last thing you got genuinely obsessed with — like really fell down a rabbit hole on? </b>→ Ask how it ended, or if it ever did.</span></div>
      <div class="spec-row"><span class="spec-key">12</span><span class="spec-val"><b>If someone handed you a Saturday with nothing planned, what would your ideal version look like? </b>→ Ask how often you actually get a day like that.</span></div>
      <div class="spec-row"><span class="spec-key">13</span><span class="spec-val"><b>What's a local spot — restaurant, park, neighborhood — that you feel weirdly possessive about? </b>→ Ask what made you claim it.</span></div>
      <div class="spec-row"><span class="spec-key">14</span><span class="spec-val"><b>What's something you collect — even informally or unexpectedly? </b>→ Ask what draws you to that particular thing.</span></div>
      <div class="spec-row"><span class="spec-key">15</span><span class="spec-val"><b>What's a physical activity that clicked for you after years of other things not working? </b>→ Ask what made that one different.</span></div>
      <div class="spec-row"><span class="spec-key">16</span><span class="spec-val"><b>What's a podcast, newsletter, or creator you'd recommend to almost anyone? </b>→ Ask what made you stick with them.</span></div>
      <div class="spec-row"><span class="spec-key">17</span><span class="spec-val"><b>What's something you do alone that you'd never want to turn into a group activity? </b>→ Ask what would be lost.</span></div>
      <div class="spec-row"><span class="spec-key">18</span><span class="spec-val"><b>What's a pursuit you're currently learning that you're still objectively not good at yet? </b>→ Ask if the struggle is part of what keeps you going.</span></div>
    </div>

    <div class="divider">§</div>

    <div class="spec-block">
      <div class="spec-row"><span class="spec-key">TRAVEL</span><span class="spec-val">16 questions</span></div>
      <div class="spec-row"><span class="spec-key">01</span><span class="spec-val"><b>What's a place you've been that genuinely surprised you — not what you expected at all? </b>→ Ask what you thought it would be like beforehand.</span></div>
      <div class="spec-row"><span class="spec-key">02</span><span class="spec-val"><b>What's the trip that changed you most, and what actually shifted? </b>→ Ask if you could see it happening in the moment.</span></div>
      <div class="spec-row"><span class="spec-key">03</span><span class="spec-val"><b>What's a place you've been back to more than once, and what keeps pulling you back? </b>→ Ask if it feels different each time.</span></div>
      <div class="spec-row"><span class="spec-key">04</span><span class="spec-val"><b>What's the most chaotic or unexpected thing that's happened while traveling? </b>→ Ask how you look back on it now.</span></div>
      <div class="spec-row"><span class="spec-key">05</span><span class="spec-val"><b>Where do you want to go next — and what's been stopping you from going? </b>→ Ask what finally would push you to book it.</span></div>
      <div class="spec-row"><span class="spec-key">06</span><span class="spec-val"><b>How does your travel style compare to who you were the first time you traveled on your own? </b>→ Ask what shifted your priorities.</span></div>
      <div class="spec-row"><span class="spec-key">07</span><span class="spec-val"><b>What's a meal or food you had while traveling that you've spent years trying to recreate? </b>→ Ask where it was and what made it so hard to replicate.</span></div>
      <div class="spec-row"><span class="spec-key">08</span><span class="spec-val"><b>What's the most off-the-beaten-path place you've been to that most people have never heard of? </b>→ Ask if you'd ever go back or wanted to keep it undiscovered.</span></div>
      <div class="spec-row"><span class="spec-key">09</span><span class="spec-val"><b>What does your ideal trip actually look like — what makes a trip feel worth it to you? </b>→ Ask what the last trip that felt that way was.</span></div>
      <div class="spec-row"><span class="spec-key">10</span><span class="spec-val"><b>What's a destination that lived up to all the hype — and one that absolutely didn't? </b>→ Ask what you think made the difference.</span></div>
      <div class="spec-row"><span class="spec-key">11</span><span class="spec-val"><b>What's something you always wish you had known about a place before you got there? </b>→ Ask how you found out the hard way.</span></div>
      <div class="spec-row"><span class="spec-key">12</span><span class="spec-val"><b>What's the longest you've spent in one place when traveling, and what was that like? </b>→ Ask what it taught you about how you actually live day to day.</span></div>
      <div class="spec-row"><span class="spec-key">13</span><span class="spec-val"><b>If you could live somewhere for a year — not just visit — where would you actually try? </b>→ Ask what the real draw is beyond the obvious.</span></div>
      <div class="spec-row"><span class="spec-key">14</span><span class="spec-val"><b>What's a cultural difference you encountered abroad that completely reframed how you see something at home? </b>→ Ask if it's something you've consciously carried back.</span></div>
      <div class="spec-row"><span class="spec-key">15</span><span class="spec-val"><b>What's the most meaningful conversation you've had with a stranger while traveling? </b>→ Ask what made it stick.</span></div>
      <div class="spec-row"><span class="spec-key">16</span><span class="spec-val"><b>What's a place you thought you'd love but left feeling disconnected from? </b>→ Ask if you think timing or circumstances had anything to do with it.</span></div>
    </div>

    <div class="divider">§</div>

    <div class="spec-block">
      <div class="spec-row"><span class="spec-key">RELATIONSHIPS &amp; VALUES</span><span class="spec-val">18 questions</span></div>
      <div class="spec-row"><span class="spec-key">01</span><span class="spec-val"><b>What's something you look for in a friend that's really hard to put into words? </b>→ Ask if you can think of a person who has that quality.</span></div>
      <div class="spec-row"><span class="spec-key">02</span><span class="spec-val"><b>What's the quality you most want people to feel when they're around you? </b>→ Ask if you think you actually pull that off most of the time.</span></div>
      <div class="spec-row"><span class="spec-key">03</span><span class="spec-val"><b>How do you know when you trust someone? </b>→ Ask how long it usually takes and if that's changed over time.</span></div>
      <div class="spec-row"><span class="spec-key">04</span><span class="spec-val"><b>What's a belief you held really strongly that someone close to you slowly changed your mind on? </b>→ Ask what it felt like to shift.</span></div>
      <div class="spec-row"><span class="spec-key">05</span><span class="spec-val"><b>What does a really good friendship look like to you right now — what does it actually need to have? </b>→ Ask how that's evolved from what you needed in your twenties.</span></div>
      <div class="spec-row"><span class="spec-key">06</span><span class="spec-val"><b>What's something you've had to forgive — yourself or someone else — that was harder than you expected? </b>→ Ask what eventually made it possible.</span></div>
      <div class="spec-row"><span class="spec-key">07</span><span class="spec-val"><b>What's a value that feels so central to who you are that you couldn't see yourself changing it? </b>→ Ask if you've ever been tested on it.</span></div>
      <div class="spec-row"><span class="spec-key">08</span><span class="spec-val"><b>What's the best relationship you've ever learned from — romantic or not? </b>→ Ask what you took away from it, good or complicated.</span></div>
      <div class="spec-row"><span class="spec-key">09</span><span class="spec-val"><b>How do you handle conflict with people you're close to — do you go quiet, push back, or something else? </b>→ Ask if that's gotten easier or harder over time.</span></div>
      <div class="spec-row"><span class="spec-key">10</span><span class="spec-val"><b>What's something people misread about you when they first meet you? </b>→ Ask how long it usually takes for people to figure out the real version.</span></div>
      <div class="spec-row"><span class="spec-key">11</span><span class="spec-val"><b>What's a quality you used to judge in other people that you now catch yourself doing too? </b>→ Ask what brought that shift in perspective.</span></div>
      <div class="spec-row"><span class="spec-key">12</span><span class="spec-val"><b>What does loyalty mean to you in practice — not just as an idea? </b>→ Ask for an example of when it really showed up.</span></div>
      <div class="spec-row"><span class="spec-key">13</span><span class="spec-val"><b>What's the most important thing you've learned from watching someone else's relationship — good or bad? </b>→ Ask if you've ever told them that.</span></div>
      <div class="spec-row"><span class="spec-key">14</span><span class="spec-val"><b>What's something you need from people that you find hard to ask for directly? </b>→ Ask when you realized that was hard for you.</span></div>
      <div class="spec-row"><span class="spec-key">15</span><span class="spec-val"><b>What's a boundary you've gotten better at holding that used to make you feel guilty? </b>→ Ask what changed.</span></div>
      <div class="spec-row"><span class="spec-key">16</span><span class="spec-val"><b>What's a type of person you used to avoid but have come to really appreciate? </b>→ Ask what changed your perspective.</span></div>
      <div class="spec-row"><span class="spec-key">17</span><span class="spec-val"><b>What's the most generous thing someone has done for you that they probably didn't think was a big deal? </b>→ Ask if you've ever told them how much it meant.</span></div>
      <div class="spec-row"><span class="spec-key">18</span><span class="spec-val"><b>What does it look like when you feel genuinely seen by someone? </b>→ Ask the last time that happened.</span></div>
    </div>

    <div class="divider">§</div>

    <div class="spec-block">
      <div class="spec-row"><span class="spec-key">HYPOTHETICALS &amp; FUN</span><span class="spec-val">18 questions</span></div>
      <div class="spec-row"><span class="spec-key">01</span><span class="spec-val"><b>If you could have dinner with anyone — dead or alive — who would you actually pick, and what would you ask them? </b>→ Ask what you're hoping they'd say.</span></div>
      <div class="spec-row"><span class="spec-key">02</span><span class="spec-val"><b>If you had to live in a different decade, which one would you actually pick and why? </b>→ Ask what you think you'd miss most about now.</span></div>
      <div class="spec-row"><span class="spec-key">03</span><span class="spec-val"><b>If you had to eat one cuisine for the rest of your life, what would save you from losing your mind? </b>→ Ask what dish within that cuisine would carry the most weight.</span></div>
      <div class="spec-row"><span class="spec-key">04</span><span class="spec-val"><b>If you found out you had six months to do whatever you wanted with unlimited money, what's the first thing you'd actually do? </b>→ Ask what would come after the obvious thing.</span></div>
      <div class="spec-row"><span class="spec-key">05</span><span class="spec-val"><b>What's a skill you'd pick if you could wake up tomorrow being genuinely excellent at it? </b>→ Ask what you'd do with it.</span></div>
      <div class="spec-row"><span class="spec-key">06</span><span class="spec-val"><b>If you could swap lives with someone for a week — not a celebrity, someone you actually know — who would it be? </b>→ Ask what you think would shock you most about their life.</span></div>
      <div class="spec-row"><span class="spec-key">07</span><span class="spec-val"><b>If you had to describe your personality as a type of weather, what would you be? </b>→ Ask if you'd want to be different weather.</span></div>
      <div class="spec-row"><span class="spec-key">08</span><span class="spec-val"><b>What's a historical event you'd want to witness from the crowd — not participate in, just watch? </b>→ Ask what draws you to that specific moment.</span></div>
      <div class="spec-row"><span class="spec-key">09</span><span class="spec-val"><b>If you could have one superpower but it comes with one ridiculous limitation, what's the combo you'd accept? </b>→ Ask how that limitation would come back to haunt you.</span></div>
      <div class="spec-row"><span class="spec-key">10</span><span class="spec-val"><b>If someone made a documentary about your life right now, what would the title be? </b>→ Ask if the title five years ago would be different.</span></div>
      <div class="spec-row"><span class="spec-key">11</span><span class="spec-val"><b>If you had to teach a class on anything — and you could pick the topic — what would it be? </b>→ Ask who you'd want in the room.</span></div>
      <div class="spec-row"><span class="spec-key">12</span><span class="spec-val"><b>What animal would you be and what would that say about you? </b>→ Ask if the animal you'd want to be is the same as the one you'd actually be.</span></div>
      <div class="spec-row"><span class="spec-key">13</span><span class="spec-val"><b>If you could delete one invention from history, what goes first? </b>→ Ask what you think the world would look like without it.</span></div>
      <div class="spec-row"><span class="spec-key">14</span><span class="spec-val"><b>If you had to move to a different city with no prep time, where would you land? </b>→ Ask what you'd do first to feel at home.</span></div>
      <div class="spec-row"><span class="spec-key">15</span><span class="spec-val"><b>What's the most useless talent you have that you're oddly proud of? </b>→ Ask the last time it actually came in handy.</span></div>
      <div class="spec-row"><span class="spec-key">16</span><span class="spec-val"><b>If you were a main character in a movie, what genre would your life be set in? </b>→ Ask who'd play you.</span></div>
      <div class="spec-row"><span class="spec-key">17</span><span class="spec-val"><b>What's something completely mundane you could make sound dramatic if you tried? </b>→ Ask them to try right now.</span></div>
      <div class="spec-row"><span class="spec-key">18</span><span class="spec-val"><b>If you could only keep three apps on your phone, what survives the cut? </b>→ Ask what you'd miss most from everything you'd delete.</span></div>
    </div>

    <div class="divider">§</div>

    <div class="spec-block">
      <div class="spec-row"><span class="spec-key">OPINIONS &amp; HOT TAKES</span><span class="spec-val">18 questions</span></div>
      <div class="spec-row"><span class="spec-key">01</span><span class="spec-val"><b>What's a popular opinion you think is mostly just people not thinking hard enough about it? </b>→ Ask if there's one version of the argument that actually gives you pause.</span></div>
      <div class="spec-row"><span class="spec-key">02</span><span class="spec-val"><b>What's something everyone does that you think is actually kind of overrated? </b>→ Ask what you do instead.</span></div>
      <div class="spec-row"><span class="spec-key">03</span><span class="spec-val"><b>What's the most unpopular food opinion you'll defend to your last breath? </b>→ Ask who the most offended person has been when you shared it.</span></div>
      <div class="spec-row"><span class="spec-key">04</span><span class="spec-val"><b>What's an era of culture — music, film, fashion, whatever — that you think people are too nostalgic for? </b>→ Ask what they're conveniently forgetting about that time.</span></div>
      <div class="spec-row"><span class="spec-key">05</span><span class="spec-val"><b>What's a social norm you think people just follow without questioning? </b>→ Ask what you think would happen if more people pushed back on it.</span></div>
      <div class="spec-row"><span class="spec-key">06</span><span class="spec-val"><b>What's a genre, art form, or type of entertainment you've come to appreciate more as you've gotten older? </b>→ Ask what you think unlocked it for you.</span></div>
      <div class="spec-row"><span class="spec-key">07</span><span class="spec-val"><b>What's something that's widely considered rude that you actually think is reasonable? </b>→ Ask what situation made you form that view.</span></div>
      <div class="spec-row"><span class="spec-key">08</span><span class="spec-val"><b>What's a piece of advice people give constantly that you actually think causes more harm than good? </b>→ Ask where you think it goes wrong.</span></div>
      <div class="spec-row"><span class="spec-key">09</span><span class="spec-val"><b>What's a societal value that you think people pay lip service to but don't actually believe? </b>→ Ask what you think people really prioritize instead.</span></div>
      <div class="spec-row"><span class="spec-key">10</span><span class="spec-val"><b>What's a technology or trend you genuinely think made life worse? </b>→ Ask what you think the alternative could have looked like.</span></div>
      <div class="spec-row"><span class="spec-key">11</span><span class="spec-val"><b>What's something in your city or neighborhood that everyone complains about but nobody actually tries to change? </b>→ Ask if you've ever tried.</span></div>
      <div class="spec-row"><span class="spec-key">12</span><span class="spec-val"><b>What's a genre of music or type of movie that you love but feel like you'd get judged for admitting? </b>→ Ask who you've finally told.</span></div>
      <div class="spec-row"><span class="spec-key">13</span><span class="spec-val"><b>What's the best decade of pop culture that most people get wrong? </b>→ Ask what they keep getting wrong about it.</span></div>
      <div class="spec-row"><span class="spec-key">14</span><span class="spec-val"><b>What's something people treat as a personality trait that you think is more of a choice? </b>→ Ask where the line is for you.</span></div>
      <div class="spec-row"><span class="spec-key">15</span><span class="spec-val"><b>What's a topic people argue about online that you think is way less complicated in real life? </b>→ Ask what you think makes it seem more divisive than it is.</span></div>
      <div class="spec-row"><span class="spec-key">16</span><span class="spec-val"><b>What's a cultural import — food, tradition, idea — from another country that you think your country needs more of? </b>→ Ask what you think holds it back.</span></div>
      <div class="spec-row"><span class="spec-key">17</span><span class="spec-val"><b>What's something you changed your mind on completely in the last five years? </b>→ Ask what tipped you over.</span></div>
      <div class="spec-row"><span class="spec-key">18</span><span class="spec-val"><b>What's a cliché that you think is actually completely true and people just dismiss too quickly? </b>→ Ask if you had to live through something to believe it.</span></div>
    </div>

    <div class="divider">§</div>

    <div class="spec-block">
      <div class="spec-row"><span class="spec-key">FUTURE GOALS</span><span class="spec-val">16 questions</span></div>
      <div class="spec-row"><span class="spec-key">01</span><span class="spec-val"><b>What's something you're working toward right now that you're genuinely excited about? </b>→ Ask where you see yourself with it in a year.</span></div>
      <div class="spec-row"><span class="spec-key">02</span><span class="spec-val"><b>What does the best version of your life look like five years from now — not the ideal, the realistic one? </b>→ Ask what the gap between that and now actually looks like.</span></div>
      <div class="spec-row"><span class="spec-key">03</span><span class="spec-val"><b>What's a version of yourself you're actively trying to grow into? </b>→ Ask what's the hardest part of that shift.</span></div>
      <div class="spec-row"><span class="spec-key">04</span><span class="spec-val"><b>What's something you want to get better at this year that isn't career-related at all? </b>→ Ask what's been the barrier so far.</span></div>
      <div class="spec-row"><span class="spec-key">05</span><span class="spec-val"><b>What's a goal you've been putting off that you know you'd regret not starting? </b>→ Ask what would actually need to change for you to begin.</span></div>
      <div class="spec-row"><span class="spec-key">06</span><span class="spec-val"><b>What does home feel like to you — and is what you have now close to that? </b>→ Ask what's missing, if anything.</span></div>
      <div class="spec-row"><span class="spec-key">07</span><span class="spec-val"><b>What's something you want to do before you turn the next major age milestone? </b>→ Ask how close you are to actually doing it.</span></div>
      <div class="spec-row"><span class="spec-key">08</span><span class="spec-val"><b>What's a relationship in your life you want to invest more in going forward? </b>→ Ask what gets in the way of that right now.</span></div>
      <div class="spec-row"><span class="spec-key">09</span><span class="spec-val"><b>What's a habit you've been trying to build that's been harder than you thought? </b>→ Ask what version of you successfully has that habit.</span></div>
      <div class="spec-row"><span class="spec-key">10</span><span class="spec-val"><b>What's something you're saving for — money, energy, or time — and what for? </b>→ Ask if the goal is still what originally motivated it.</span></div>
      <div class="spec-row"><span class="spec-key">11</span><span class="spec-val"><b>What's a risk you're seriously considering taking? </b>→ Ask what the best realistic outcome looks like.</span></div>
      <div class="spec-row"><span class="spec-key">12</span><span class="spec-val"><b>What would need to be true about your life for you to feel settled — not necessarily finished, just settled? </b>→ Ask how far off that feels.</span></div>
      <div class="spec-row"><span class="spec-key">13</span><span class="spec-val"><b>What's a cause or community that you want to contribute more to in the next chapter of your life? </b>→ Ask what's drawn you to it.</span></div>
      <div class="spec-row"><span class="spec-key">14</span><span class="spec-val"><b>What's a version of success you've quietly stopped wanting, and what replaced it? </b>→ Ask when the shift happened.</span></div>
      <div class="spec-row"><span class="spec-key">15</span><span class="spec-val"><b>What's something you hope is completely different about your life in ten years? </b>→ Ask what has to happen for that to change.</span></div>
      <div class="spec-row"><span class="spec-key">16</span><span class="spec-val"><b>What's one thing you want to be known for that you haven't built yet? </b>→ Ask what the first real step toward that looks like.</span></div>
    </div>

    <div class="divider">§</div>

    <div class="annotation">
      <p>Use one question per conversation, never several in a row. The follow-up is the real signal — it tells her you were actually listening, not just waiting for your turn. Questions about the future and values land harder once warmth is already there; hypotheticals are the fastest route to playfulness when things feel stiff.</p>
    </div>

    <div class="prose">
      <p>The goal is never to impress someone with your questions. It is to give them a reason to say something true — something they did not plan to say before they sat down. That is the whole game, and it starts with a single question asked with genuine curiosity and enough quiet afterward to let the answer actually arrive.<span class="cursor"></span></p>
    </div>
  `
