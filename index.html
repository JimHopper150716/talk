<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE MANUSCRIPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet" />

  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #000000;
      --panel:        #000000;
      --panel-hover:  #141e35;
      --border:       #1e2d50;
      --accent:       #4a9eff;
      --accent-dim:   #1e4a8a;
      --text:         #d8d0bc;
      --text-dim:     #7a7260;
      --text-faint:   #3a3828;
      --paper:        #c8bfa8;
      --red:          #c0392b;
      --sidebar-w:    260px;
      --header-h:     54px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.75;
      overflow: hidden;
    }

    /* ── BLUEPRINT GRID (signature element) ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px),
        linear-gradient(rgba(74,158,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,158,255,0.03) 1px, transparent 1px);
      background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
      opacity: 0.45;
    }

    /* ── SCANLINE OVERLAY ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.06) 2px,
        rgba(0,0,0,0.06) 4px
      );
    }

    /* ── LAYOUT SHELL ── */
    #shell {
      position: relative;
      z-index: 1;
      display: flex;
      height: 100vh;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: width 0.3s ease;
      position: relative;
    }

    #sidebar.collapsed {
      width: 48px;
    }

    .sidebar-header {
      height: var(--header-h);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
    }

    .sidebar-label {
      font-family: 'Special Elite', serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.2s;
    }

    #sidebar.collapsed .sidebar-label { opacity: 0; }

    .toggle-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s, color 0.2s;
      font-size: 12px;
      line-height: 1;
    }

    .toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* chapter list */
    #chapter-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 0;
    }

    #chapter-list::-webkit-scrollbar { width: 4px; }
    #chapter-list::-webkit-scrollbar-thumb { background: var(--border); }

    .chapter-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 14px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
      overflow: hidden;
    }

    .chapter-item:hover {
      background: var(--panel-hover);
    }

    .chapter-item.active {
      border-left-color: var(--accent);
      background: var(--panel-hover);
    }

    .ch-num {
      font-size: 10px;
      color: var(--accent-dim);
      letter-spacing: 0.1em;
      padding-top: 2px;
      flex-shrink: 0;
      font-family: 'Courier Prime', monospace;
    }

    .chapter-item.active .ch-num { color: var(--accent); }

    .ch-title {
      font-size: 12px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
      transition: color 0.15s;
    }

    .chapter-item:hover .ch-title,
    .chapter-item.active .ch-title { color: var(--text); }

    /* sidebar footer */
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 12px;
      flex-shrink: 0;
    }

    .add-chapter-btn {
      width: 100%;
      background: none;
      border: 1px dashed var(--accent-dim);
      color: var(--accent-dim);
      font-family: 'Courier Prime', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 8px 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      white-space: nowrap;
      overflow: hidden;
    }

    .add-chapter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(74,158,255,0.04);
    }

    .add-chapter-btn .btn-text {
      opacity: 1;
      transition: opacity 0.2s;
    }

    #sidebar.collapsed .add-chapter-btn .btn-text { opacity: 0; width: 0; overflow: hidden; }
    #sidebar.collapsed .add-chapter-btn { justify-content: center; }

    /* ── MAIN AREA ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* top bar */
    #topbar {
      height: var(--header-h);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 16px;
      flex-shrink: 0;
    }

    .doc-title {
      font-family: 'Special Elite', serif;
      font-size: 14px;
      letter-spacing: 0.12em;
      color: var(--paper);
      flex: 1;
    }

    .meta-tag {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-faint);
      text-transform: uppercase;
      border: 1px solid var(--text-faint);
      padding: 2px 7px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── CONTENT AREA ── */
    #content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 48px 60px 80px;
    }

    #content::-webkit-scrollbar { width: 6px; }
    #content::-webkit-scrollbar-thumb { background: var(--border); }

    /* page wrapper */
    .page {
      display: none;
      max-width: 720px;
    }

    .page.active { display: block; }

    /* chapter heading */
    .chapter-heading {
      margin-bottom: 40px;
    }

    .ch-eyebrow {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ch-eyebrow::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--accent-dim);
      max-width: 120px;
      opacity: 0.4;
    }

    .chapter-title {
      font-family: 'Special Elite', serif;
      font-size: 32px;
      line-height: 1.25;
      color: var(--paper);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .chapter-subtitle {
      font-size: 13px;
      color: var(--text-dim);
      font-style: italic;
    }

    /* body text */
    .prose p {
      margin-bottom: 22px;
      color: var(--text);
    }

    .prose p:first-child::first-letter {
      font-family: 'Special Elite', serif;
      font-size: 3em;
      line-height: 0.8;
      float: left;
      margin-right: 8px;
      margin-top: 4px;
      color: var(--paper);
    }
    .prose2 p {
      margin-bottom: 22px;
      color: var(--text);
    }

    /* inline annotation */
    .annotation {
      border-left: 2px solid var(--accent-dim);
      padding: 12px 18px;
      margin: 28px 0;
      background: rgba(74,158,255,0.03);
    }

    .annotation p {
      font-size: 13px;
      color: var(--text-dim);
      margin: 0;
    }

    .annotation p::before {
      content: '// ';
      color: var(--accent-dim);
    }

    /* field / spec line */
    .spec-block {
      margin: 28px 0;
      border: 1px solid var(--border);
      padding: 18px 22px;
    }

    .spec-row {
      display: flex;
      gap: 20px;
      padding: 6px 0;
      border-bottom: 1px solid var(--text-faint);
      font-size: 12px;
    }

    .spec-row:last-child { border-bottom: none; }

    .spec-key {
      color: var(--text-dim);
      letter-spacing: 0.08em;
      min-width: 140px;
      flex-shrink: 0;
    }

    .spec-val { color: var(--paper); }

    /* blinking cursor */
    .cursor {
      display: inline-block;
      width: 9px;
      height: 16px;
      background: var(--accent);
      vertical-align: middle;
      margin-left: 3px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 36px 0;
      color: var(--text-faint);
      font-size: 11px;
      letter-spacing: 0.2em;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── TYPEWRITER ANIMATION ── */
    @keyframes typeIn {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0% 0 0); }
    }

    .page.active .chapter-title {
      animation: typeIn 0.6s steps(30, end) both;
    }

    /* ── MODAL: ADD CHAPTER ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8,12,24,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #modal-overlay.open { display: flex; }

    #modal {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 32px 36px;
      min-width: 360px;
      position: relative;
    }

    #modal h2 {
      font-family: 'Special Elite', serif;
      font-size: 16px;
      color: var(--paper);
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }

    #modal label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    #modal input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Courier Prime', monospace;
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    #modal input:focus { border-color: var(--accent); }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'Courier Prime', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      padding: 7px 16px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }

    .btn-primary {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Courier Prime', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      padding: 7px 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover { background: rgba(74,158,255,0.25); }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      :root { --sidebar-w: 220px; }
      #content { padding: 32px 24px 60px; }
      .chapter-title { font-size: 24px; }
    }
    /* ── COLLAPSIBLE STYLING ── */
details {
  margin-bottom: 12px;
}

summary {
  cursor: pointer;
  list-style: none; /* Removes default arrow */
  outline: none;
}

summary::-webkit-details-marker {
  display: none; /* Removes arrow in Webkit */
}

/* Category Headers (the Vibe Header) */
.category-summary {
  font-family: 'Special Elite', serif;
  font-size: 20px;
  color: var(--paper);
  border-bottom: 1px solid var(--border);
  padding: 10px 0;
  margin-bottom: 20px;
  display: block;
}

/* Question Summary */
.question-summary {
  font-weight: bold;
  color: var(--text);
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.question-summary:hover {
  color: var(--accent);
}

/* Add an indicator (plus/minus) */
summary::before {
  content: '[+] ';
  color: var(--accent-dim);
  font-family: monospace;
}

details[open] > summary::before {
  content: '[-] ';
}
  </style>
</head>
<body>

<div id="shell">

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <button class="toggle-btn" id="toggleBtn" title="Toggle sidebar" aria-label="Toggle sidebar">&#x2630;</button>
      <span class="sidebar-label">Chapters</span>
    </div>

    <div id="chapter-list">
      <!-- populated by JS -->
    </div>

    <div class="sidebar-footer">
      <button class="add-chapter-btn" id="addChapterBtn">
        <span>+</span>
        <span class="btn-text">New Chapter</span>
      </button>
    </div>
  </nav>

  <!-- MAIN -->
  <div id="main">
    <header id="topbar">
      <span class="doc-title">THE MANUSCRIPT</span>
      <span class="meta-tag">DRAFT 01</span>
      <span class="meta-tag" id="chapterCount">— ch</span>
      <div class="status-dot" title="Live"></div>
    </header>

    <div id="content">
      <!-- pages rendered by JS -->
    </div>
  </div>

</div>

<!-- ADD CHAPTER MODAL -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div id="modal">
    <h2 id="modal-title">// NEW CHAPTER</h2>
    <label for="ch-title-input">Chapter Title</label>
    <input id="ch-title-input" type="text" placeholder="Enter title..." maxlength="60" autocomplete="off" />
    <label for="ch-sub-input">Subtitle <span style="opacity:.4">(optional)</span></label>
    <input id="ch-sub-input" type="text" placeholder="A brief description..." maxlength="80" autocomplete="off" />
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelBtn">CANCEL</button>
      <button class="btn-primary" id="confirmBtn">ADD CHAPTER</button>
    </div>
  </div>
</div>

<script>
  // ── DATA ──────────────────────────────────────────────────────────────
  const chapters = [
  {
      id: '0.1',
      num: '0.1',
      title: 'quick-fix',
      subtitle: 'random quick throw bullshit',
      content:''
      },
    {
      id: '1.1 ',
      num: '1.1',
      title: 'Core open-ended questions & Follow Ups',
      subtitle: 'The girl should reveal more personal things about herself. So she feels more comfortable around you.',
      content: `
    <div class="prose">
      <p>Girl should talk 70%, you should talk 30%. But in that 30, make it about you, not just nod.</div>
<details>
      <summary class="category-summary">I. CHILDHOOD & BACKGROUND</summary>
        <summary class="question-summary">01. What's something about the place you grew up that most outsiders would never guess?</summary>
</div>
<div class="annotation">
  <p>→ What did growing up with that hidden side teach you that you couldn't have learned anywhere else?<br/>→ Did you feel proud of it, embarrassed by it, or something more complicated when you were young?<br/>→ Is it still true about the place, or has it changed since you left?<br/>→ What do you miss most about it, or what were you glad to leave behind?</p>
</div>

<summary class="question-summary">02. Who was the most memorable teacher you ever had, and what made them stick with you?</summary>
<div class="annotation">
  <p>→ Did you ever tell them how much they meant to you — and if not, do you ever think about doing that?<br/>→ Was there a specific moment in their class where something clicked for you that hadn't before?<br/>→ Do you think you would have turned out differently without them, or did they just accelerate something already in you?<br/>→ Did that person change how you see things today?</p>
</div>

<summary class="question-summary">03. What did you spend most of your free time doing as a kid?</summary>
<div class="annotation">
  <p>→ Were you doing it alone or with other people, and does that say something about you now?<br/>→ Was there a point where you stopped, and was that a deliberate choice or did it just fade?<br/>→ When you think about it now, do you feel nostalgic, indifferent, or glad you moved on?<br/>→ Have you ever tried to get back into it as an adult?</p>
</div>

<summary class="question-summary">04. What's a family tradition from your childhood that felt totally normal until you realized other families didn't do it?</summary>
<div class="annotation">
  <p>→ What was the moment you realized it wasn't universal — and how did other people react when you described it?<br/>→ Do you know where the tradition came from originally, or did it just exist?<br/>→ If you've let it go, do you feel like something small was lost, or was it a relief?<br/>→ Have you kept it going or let it fade?</p>
</div>

<summary class="question-summary">05. What's the earliest memory you have that still feels vivid?</summary>
<div class="annotation">
  <p>→ Is it a happy memory, a frightening one, or something harder to categorize?<br/>→ Have you ever compared that memory with other people who were there to see if it holds up?<br/>→ Do you think the memory itself is what stayed, or the feeling attached to it?<br/>→ What do you think made it stick so clearly?</p>
</div>

<summary class="question-summary">06. What did you want to be when you grew up at age 10 — and how did that change by the time now?</summary>
<div class="annotation">
  <p>→ Looking back, can you see a thread connecting those two versions, even if it's not obvious?<br/>→ Was there a person or experience that redirected you, or did you just outgrow the first dream?<br/>→ Is there any part of the 10-year-old dream you've quietly held onto?<br/>→ What pulled you away from the original dream?</p>
</div>

<summary class="question-summary">07. Who were you closest to in your family growing up?</summary>
<div class="annotation">
  <p>→ What did that closeness look like in practice — was it conversation, shared time, something unspoken?<br/>→ Is that relationship still the anchor it was, or has distance or time changed things?<br/>→ Did anyone else in your family notice that closeness, and how did they feel about it?<br/>→ How has that relationship evolved over the years?</p>
</div>

<summary class="question-summary">08. What's the most trouble you ever got into as a kid?</summary>
<div class="annotation">
  <p>→ Was getting caught worse than you expected, or did part of you want to be found out?<br/>→ Did it change how you behaved afterward, or did you just get smarter about not getting caught?<br/>→ Is there anyone from that story you're still in touch with?<br/>→ Would you handle it differently now?</p>
</div>

<summary class="question-summary">09. What's something your parents were really strict about that you now either totally agree with or completely disagree with?</summary>
<div class="annotation">
  <p>→ Was there a specific moment when your opinion shifted, or was it more of a slow realization?<br/>→ Have you ever talked to your parents about it — told them you were right or that they were?<br/>→ If you have or had kids, did you find yourself repeating the rule or deliberately doing the opposite?<br/>→ Did your view shift gradually or all at once?</p>
</div>

<summary class="question-summary">10. What's a book, movie, or TV show from your childhood that genuinely shaped how you see the world?</summary>
<div class="annotation">
  <p>→ Was it something you were meant to watch, or did you stumble onto it on your own?<br/>→ When you went back to it as an adult, did it hold up or was it different than you remembered?<br/>→ Is there a specific scene or line from it that still surfaces in your head?<br/>→ What specifically landed differently when you revisited it as an adult?</p>
</div>

<summary class="question-summary">11. What part of your hometown do you think about more than you'd expect?</summary>
<div class="annotation">
  <p>→ Is it somewhere you spent a lot of time, or somewhere you only went occasionally?<br/>→ If you went back to it today, do you think it would still feel the way it does in your memory?<br/>→ Have you ever tried to explain why that place matters to someone else, and could you?<br/>→ What draws your mind back to that specific thing?</p>
</div>

<summary class="question-summary">12. Were you more of an introvert or extrovert as a kid, and do you think that's changed?</summary>
<div class="annotation">
  <p>→ Was there a period in your life when the shift felt most dramatic?<br/>→ Do you think your natural wiring stayed the same but your circumstances changed how it looks?<br/>→ Which version of yourself — the younger one or the current one — do you feel more at ease with?<br/>→ What do you think caused any shift?</p>
</div>

<summary class="question-summary">13. What's something you taught yourself as a teenager that no one else knew you were learning?</summary>
<div class="annotation">
  <p>→ Why did you keep it private — were you protecting it, or just not ready to share?<br/>→ Were you ever found out, or did you choose when to reveal it?<br/>→ Do you still do it, and does anyone in your life now know how seriously you once took it?<br/>→ What pushed you to learn it on your own?</p>
</div>

<summary class="question-summary">14. What's the most formative trip or adventure you had growing up?</summary>
<div class="annotation">
  <p>→ What was the thing that happened — planned or unplanned — that made it formative rather than just memorable?<br/>→ Who else was there, and do you think they remember it the same way you do?<br/>→ Did it open something up in you, or did it close something down?<br/>→ Have you been back since or thought about going?</p>
</div>

<summary class="question-summary">15. What's a value your family held that you've completely made your own — and one you've quietly let go of?</summary>
<div class="annotation">
  <p>→ Did letting go of the one feel like a betrayal at first, or was it more like exhaling?<br/>→ Is it something you could say out loud to your family, or is it still quiet for a reason?<br/>→ What replaced the value you let go of — did something else fill that space?<br/>→ Was there a specific moment you realized you'd changed your mind?</p>
</div>

    {
      id: 'ch3',
      num: '03',
      title: 'Carbon Copy',
      subtitle: 'What survives the original.',
      content: `
        <div class="prose2">
          <p>The carbon copy is the honest version. It records what actually happened rather than what you intended to say. The original can be corrected, revised, smoothed over with white paint and a steady hand. The carbon catches only what the keys struck, every hesitation, every typo, every place where the ribbon ran thin and the letters went grey.</p>
          <p>She kept them all. Three drawers of carbon copies, oldest at the back, newest at the front. Eleven years of transmission records. Of what had passed through the machine and into the world, whether the world acknowledged it or not.</p>
        </div>
        <div class="divider">§</div>
        <div class="annotation"><p>All carbon copies are considered primary source material. Handle accordingly.</p></div>
        <div class="prose2">
          <p>The copies were not perfect. That was the point. They were the evidence of contact — of the hammered key and the resistant platen and the thin film of ink passing from one surface to another. A transmission is only real when it leaves a mark somewhere.<span class="cursor"></span></p>
        </div>
      `
    }
  ];

  let activeId = chapters[0].id;
  const sidebar  = document.getElementById('sidebar');
  const chList   = document.getElementById('chapter-list');
  const content  = document.getElementById('content');
  const toggleBtn = document.getElementById('toggleBtn');
  const addBtn   = document.getElementById('addChapterBtn');
  const overlay  = document.getElementById('modal-overlay');
  const cancelBtn = document.getElementById('cancelBtn');
  const confirmBtn = document.getElementById('confirmBtn');
  const titleInput = document.getElementById('ch-title-input');
  const subInput   = document.getElementById('ch-sub-input');
  const countEl   = document.getElementById('chapterCount');

  // ── RENDER ───────────────────────────────────────────────────────────
  function render() {
    // sidebar items
    chList.innerHTML = chapters.map(ch => `
      <div class="chapter-item ${ch.id === activeId ? 'active' : ''}" data-id="${ch.id}" role="button" tabindex="0" aria-current="${ch.id === activeId ? 'page' : 'false'}">
        <span class="ch-num">${ch.num}</span>
        <span class="ch-title">${ch.title}</span>
      </div>
    `).join('');

    // pages
    content.innerHTML = chapters.map(ch => `
      <article class="page ${ch.id === activeId ? 'active' : ''}" id="page-${ch.id}">
        <div class="chapter-heading">
          <div class="ch-eyebrow">Chapter ${ch.num}</div>
          <h1 class="chapter-title">${ch.title}</h1>
          ${ch.subtitle ? `<p class="chapter-subtitle">${ch.subtitle}</p>` : ''}
        </div>
        ${ch.content}
      </article>
    `).join('');

    countEl.textContent = `${chapters.length} ch`;

    // re-bind chapter click
    chList.querySelectorAll('.chapter-item').forEach(el => {
      el.addEventListener('click', () => navigate(el.dataset.id));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') navigate(el.dataset.id); });
    });
  }

  function navigate(id) {
    activeId = id;
    render();
    content.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── SIDEBAR TOGGLE ────────────────────────────────────────────────────
  toggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
    toggleBtn.setAttribute('aria-expanded', !sidebar.classList.contains('collapsed'));
  });

  // ── ADD CHAPTER MODAL ─────────────────────────────────────────────────
  function openModal() {
    titleInput.value = '';
    subInput.value = '';
    overlay.classList.add('open');
    setTimeout(() => titleInput.focus(), 50);
  }

  function closeModal() {
    overlay.classList.remove('open');
  }

  function addChapter() {
    const t = titleInput.value.trim();
    if (!t) { titleInput.focus(); return; }
    const num = String(chapters.length + 1).padStart(2, '0');
    const id  = 'ch' + Date.now();
    chapters.push({
      id,
      num,
      title: t,
      subtitle: subInput.value.trim() || '',
      content: `
        <div class="prose2">
          <p>This chapter is yet to be written. The page waits.<span class="cursor"></span></p>
        </div>
      `
    });
    activeId = id;
    render();
    closeModal();
    content.scrollTo({ top: 0, behavior: 'smooth' });
  }

  addBtn.addEventListener('click', openModal);
  cancelBtn.addEventListener('click', closeModal);
  confirmBtn.addEventListener('click', addChapter);
  titleInput.addEventListener('keydown', e => { if (e.key === 'Enter') addChapter(); });
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── INIT ─────────────────────────────────────────────────────────────
  render();
</script>
