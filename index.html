</div>
<div class="annotation">
  <p>→ Did you ever tell them how much they meant to you — and if not, do you ever think about doing that?<br/>→ Was there a specific moment in their class where something clicked for you that hadn't before?<br/>→ Do you think you would have turned out differently without them, or did they just accelerate something already in you?</p>
</div>

<div class="prose2">
  <p><strong>03. What did you spend most of your free time doing as a kid?</strong></p>
</div>
<div class="annotation">
  <p>→ Were you doing it alone or with other people, and does that say something about you now?<br/>→ Was there a point where you stopped, and was that a deliberate choice or did it just fade?<br/>→ When you think about it now, do you feel nostalgic, indifferent, or glad you moved on?</p>
</div>

<div class="prose2">
  <p><strong>04. What's a family tradition from your childhood that felt totally normal until you realized other families didn't do it?</strong></p>
</div>
<div class="annotation">
  <p>→ What was the moment you realized it wasn't universal — and how did other people react when you described it?<br/>→ Do you know where the tradition came from originally, or did it just exist?<br/>→ If you've let it go, do you feel like something small was lost, or was it a relief?</p>
</div>

<div class="prose2">
  <p><strong>05. What's the earliest memory you have that still feels vivid?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it a happy memory, a frightening one, or something harder to categorize?<br/>→ Have you ever compared that memory with other people who were there to see if it holds up?<br/>→ Do you think the memory itself is what stayed, or the feeling attached to it?</p>
</div>

<div class="prose2">
  <p><strong>06. What did you want to be when you grew up at age 10 — and how did that change by the time now?</strong></p>
</div>
<div class="annotation">
  <p>→ Looking back, can you see a thread connecting those two versions, even if it's not obvious?<br/>→ Was there a person or experience that redirected you, or did you just outgrow the first dream?<br/>→ Is there any part of the 10-year-old dream you've quietly held onto?</p>
</div>

<div class="prose2">
  <p><strong>07. Who were you closest to in your family growing up?</strong></p>
</div>
<div class="annotation">
  <p>→ What did that closeness look like in practice — was it conversation, shared time, something unspoken?<br/>→ Is that relationship still the anchor it was, or has distance or time changed things?<br/>→ Did anyone else in your family notice that closeness, and how did they feel about it?</p>
</div>

<div class="prose2">
  <p><strong>08. What's the most trouble you ever got into as a kid?</strong></p>
</div>
<div class="annotation">
  <p>→ Was getting caught worse than you expected, or did part of you want to be found out?<br/>→ Did it change how you behaved afterward, or did you just get smarter about not getting caught?<br/>→ Is there anyone from that story you're still in touch with?</p>
</div>

<div class="prose2">
  <p><strong>09. What's something your parents were really strict about that you now either totally agree with or completely disagree with?</strong></p>
</div>
<div class="annotation">
  <p>→ Was there a specific moment when your opinion shifted, or was it more of a slow realization?<br/>→ Have you ever talked to your parents about it — told them you were right or that they were?<br/>→ If you have or had kids, did you find yourself repeating the rule or deliberately doing the opposite?</p>
</div>

<div class="prose2">
  <p><strong>10. What's a book, movie, or TV show from your childhood that genuinely shaped how you see the world?</strong></p>
</div>
<div class="annotation">
  <p>→ Was it something you were meant to watch, or did you stumble onto it on your own?<br/>→ When you went back to it as an adult, did it hold up or was it different than you remembered?<br/>→ Is there a specific scene or line from it that still surfaces in your head?</p>
</div>

<div class="prose2">
  <p><strong>11. What part of your hometown do you think about more than you'd expect?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it somewhere you spent a lot of time, or somewhere you only went occasionally?<br/>→ If you went back to it today, do you think it would still feel the way it does in your memory?<br/>→ Have you ever tried to explain why that place matters to someone else, and could you?</p>
</div>

<div class="prose2">
  <p><strong>12. Were you more of an introvert or extrovert as a kid, and do you think that's changed?</strong></p>
</div>
<div class="annotation">
  <p>→ Was there a period in your life when the shift felt most dramatic?<br/>→ Do you think your natural wiring stayed the same but your circumstances changed how it looks?<br/>→ Which version of yourself — the younger one or the current one — do you feel more at ease with?</p>
</div>

<div class="prose2">
  <p><strong>13. What's something you taught yourself as a teenager that no one else knew you were learning?</strong></p>
</div>
<div class="annotation">
  <p>→ Why did you keep it private — were you protecting it, or just not ready to share?<br/>→ Were you ever found out, or did you choose when to reveal it?<br/>→ Do you still do it, and does anyone in your life now know how seriously you once took it?</p>
</div>

<div class="prose2">
  <p><strong>14. What's the most formative trip or adventure you had growing up?</strong></p>
</div>
<div class="annotation">
  <p>→ What was the thing that happened — planned or unplanned — that made it formative rather than just memorable?<br/>→ Who else was there, and do you think they remember it the same way you do?<br/>→ Did it open something up in you, or did it close something down?</p>
</div>

<div class="prose2">
  <p><strong>15. What's a value your family held that you've completely made your own — and one you've quietly let go of?</strong></p>
</div>
<div class="annotation">
  <p>→ Did letting go of the one feel like a betrayal at first, or was it more like exhaling?<br/>→ Is it something you could say out loud to your family, or is it still quiet for a reason?<br/>→ What replaced the value you let go of — did something else fill that space?</p>
</div>

<div class="prose2">
  <p><strong>16. What did you think adulthood would feel like, and how does the reality compare?</strong></p>
</div>
<div class="annotation">
  <p>→ Was there a specific age or milestone where you thought "okay, now I'm an adult" — and did it feel the way you expected?<br/>→ What's the part that's better than you imagined, and what's the part nobody warned you about?<br/>→ Do you think you'd want your younger self to have known the truth, or was the illusion useful?</p>
</div>

<div class="prose2">
  <p><strong>17. What's the most random skill or hobby you picked up as a kid that's come in handy in some unexpected way?</strong></p>
</div>
<div class="annotation">
  <p>→ Did anyone take you seriously when you were learning it, or did people think it was a phase?<br/>→ What was the moment you realized it was actually going to be useful?<br/>→ Do you still think of it as random, or has it quietly become part of how you identify yourself?</p>
</div>

<div class="prose2">
  <p><strong>18. What was your friendship group like growing up — and how different is who you're close to now?</strong></p>
</div>
<div class="annotation">
  <p>→ Was there a natural break where the old group drifted, or was there a specific falling out?<br/>→ What did that group give you that you've looked for — consciously or not — in friendships since?<br/>→ If you ran into them today, what do you think the dynamic would be?</p>
</div>

<div class="divider">§</div>

<div class="prose2">
  <p><strong>II. WORK & AMBITION</strong></p>
  <p><strong>01. What was the moment you realized your career was actually heading somewhere?</strong></p>
</div>
<div class="annotation">
  <p>→ Was it external — someone said something, a promotion happened — or was it an internal shift?<br/>→ Did that realization feel like relief, pressure, excitement, or some combination?<br/>→ Looking back, was that moment actually the turning point, or was there a quieter one before it?</p>
</div>

<div class="prose2">
  <p><strong>02. What's the part of your job that nobody outside your field would understand?</strong></p>
</div>
<div class="annotation">
  <p>→ When you try to explain it, what's the thing people always get wrong?<br/>→ Does the misunderstanding frustrate you or have you made peace with it?<br/>→ Is there a version of that misunderstood part you actually wish were different about the job?</p>
</div>

<div class="prose2">
  <p><strong>03. What's a skill you've built at work that surprised even you?</strong></p>
</div>
<div class="annotation">
  <p>→ Did you resist learning it at first, or did you fall into it naturally?<br/>→ Was there a specific situation that forced you to develop it faster than you expected?<br/>→ Does having that skill now make you see the earlier version of yourself differently?</p>
</div>

<div class="prose2">
  <p><strong>04. Who's the most influential person you've had as a mentor or boss, and what made them different?</strong></p>
</div>
<div class="annotation">
  <p>→ Did they know how much they influenced you, or was it something you only processed later?<br/>→ Was there a specific decision they made — about you or something else — that showed you who they were?<br/>→ Have you ever tried to consciously model yourself on them, or does it happen without thinking?</p>
</div>

<div class="prose2">
  <p><strong>05. What would your 22-year-old self think of what you do now?</strong></p>
</div>
<div class="annotation">
  <p>→ Is there a part of your current life that would genuinely impress them, and a part that would confuse or disappoint them?<br/>→ What did 22-year-old you think success looked like, and where did that idea come from?<br/>→ What would you want to tell that version of yourself that they wouldn't believe yet?</p>
</div>

<div class="prose2">
  <p><strong>06. What's the most uncomfortable decision you've had to make at work?</strong></p>
</div>
<div class="annotation">
  <p>→ Who else was affected by it, and how did that weigh on you?<br/>→ Did you have to make it alone or did you have people to talk it through with?<br/>→ If you had to make it again today, would you do anything differently?</p>
</div>

<div class="prose2">
  <p><strong>07. What does ambition actually look like to you — how do you define it for yourself?</strong></p>
</div>
<div class="annotation">
  <p>→ Is your definition of ambition different from what the people around you seem to mean by it?<br/>→ Has what you're ambitious about changed over time, even if the drive itself hasn't?<br/>→ Is there a version of ambition you've seen in other people that you'd never want for yourself?</p>
</div>

<div class="prose2">
  <p><strong>08. What's a total career failure you had that ended up mattering more than you expected?</strong></p>
</div>
<div class="annotation">
  <p>→ In the middle of it, did you have any sense that it might turn into something useful, or was it just painful?<br/>→ What was the thing — a person, a realization, a stroke of luck — that helped you turn the corner on it?<br/>→ Is it something you talk about openly now, or does it still feel like something to get past?</p>
</div>

<div class="prose2">
  <p><strong>09. If you could swap industries for a year with no consequences, what would you try?</strong></p>
</div>
<div class="annotation">
  <p>→ Is this something you seriously considered at some point, or is it purely hypothetical?<br/>→ What do you think the hardest thing about that world would actually be?<br/>→ Is there a skill from your current work that would translate better than people in that field might expect?</p>
</div>

<div class="prose2">
  <p><strong>10. What's the gap between what you tell people you do and what you actually do all day?</strong></p>
</div>
<div class="annotation">
  <p>→ Is the gap embarrassing, boring to explain, or something you've actually come to like about the job?<br/>→ When did you stop trying to close the gap and just accept the shorthand version?<br/>→ What's the part of your actual day that you'd most want people to understand?</p>
</div>

<div class="prose2">
  <p><strong>11. What does success feel like for you — what does it actually look like on a day-to-day basis?</strong></p>
</div>
<div class="annotation">
  <p>→ On a day where you feel successful, what's happening that's different from the days that feel flat?<br/>→ Has your definition shifted from external markers to internal ones, or the other way around?<br/>→ Is there someone in your life whose version of success you look at and think "that's what I want"?</p>
</div>

<div class="prose2">
  <p><strong>12. What's something you were told you'd never be good at that you've actually gotten really good at?</strong></p>
</div>
<div class="annotation">
  <p>→ Who said it — was it someone who mattered to you, or a throwaway comment that just stuck?<br/>→ Did proving them wrong feel like satisfaction, vindication, or did it stop mattering once you got there?<br/>→ Do you think that challenge actually made you better at it than you would have been otherwise?</p>
</div>

<div class="prose2">
  <p><strong>13. What's the part of your work that doesn't show up on a résumé but that you're most proud of?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it something you do for others, for the work itself, or for your own standards?<br/>→ Do you think the people around you see it, even if they don't name it?<br/>→ Why do you think that's the thing you're most proud of rather than something more visible?</p>
</div>

<div class="prose2">
  <p><strong>14. What would you work on if you knew it couldn't fail but also might not pay well?</strong></p>
</div>
<div class="annotation">
  <p>→ Is this something you're already doing in some small way on the side?<br/>→ What's the honest barrier — is it money, fear of failure, what other people would think, or something else?<br/>→ If you gave it a year and it didn't take off, would you feel like you'd lost something or gained something?</p>
</div>

<div class="prose2">
  <p><strong>15. What's the best piece of career advice you've gotten — and what's the worst?</strong></p>
</div>
<div class="annotation">
  <p>→ For the best advice — did you take it immediately or did you resist it first?<br/>→ For the worst — what made it sound reasonable enough that you actually followed it for a while?<br/>→ Is there advice you find yourself giving now that you're not sure is actually right?</p>
</div>

<div class="prose2">
  <p><strong>16. How much does what you do for work feel like who you are?</strong></p>
</div>
<div class="annotation">
  <p>→ Is that a comfortable overlap or does it ever feel like the work takes up more of your identity than you'd want?<br/>→ When you're away from work — on vacation, between jobs — what does it feel like without that anchor?<br/>→ If you had to describe yourself without mentioning your job at all, what would you lead with?</p>
</div>

<div class="prose2">
  <p><strong>17. What's something you're working toward right now that most people in your life don't know about?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it quiet because it's not ready, or because you're protecting it from other people's opinions?<br/>→ Is there one person you've told, or is it completely private?<br/>→ At what point do you think you'll be ready to talk about it?</p>
</div>

<div class="prose2">
  <p><strong>18. What's the last time work genuinely energized you rather than just tired you out?</strong></p>
</div>
<div class="annotation">
  <p>→ What was it specifically about that moment — the task, the people, the stakes, the outcome?<br/>→ How often does that happen, and has the frequency changed over time?<br/>• What would need to be different for it to happen more regularly?</p>
</div>

<div class="divider">§</div>

<div class="prose2">
  <p><strong>III. HOBBIES & PASSIONS</strong></p>
  <p><strong>01. What's something you do just for yourself that has nothing to do with being productive?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it hard to let it be purely for enjoyment, or have you gotten good at switching that part of your brain off?<br/>• Did you have to give yourself permission to do something "useless," or did it come naturally?<br/>→ How do you feel after doing it — is it restorative, or does it just pass time?</p>
</div>

<div class="prose2">
  <p><strong>02. What's a hobby or interest you've had forever that you feel like most people underestimate?</strong></p>
</div>
<div class="annotation">
  <p>→ What's the most common misconception people have about it when you first bring it up?<br/>→ Is there a community around it that you're part of, or is it something you mostly do on your own?<br/>→ What would you want someone to know before they dismissed it?</p>
</div>

<div class="prose2">
  <p><strong>03. What's the thing you can spend three hours on and lose track of time completely?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it something you discovered on purpose or fell into accidentally?<br/>→ Does it require a particular kind of environment or mood, or can you drop into it anywhere?<br/>→ When you come out of it, how do you feel — rested, accomplished, drained, all of the above?</p>
</div>

<div class="prose2">
  <p><strong>04. What's a creative outlet that surprised you by how much you ended up loving it?</strong></p>
</div>
<div class="annotation">
  <p>→ What were you expecting before you tried it, and how quickly did your expectations shift?<br/>→ Were you good at it right away, or did you have to push through an awkward phase first?<br/>→ Has it spilled over into other areas of your life in ways you didn't anticipate?</p>
</div>

<div class="prose2">
  <p><strong>05. What's a skill you're actively trying to get better at right now?</strong></p>
</div>
<div class="annotation">
  <p>→ Are you learning it alone or with other people, and does that affect how you're progressing?<br/>→ What does "good enough" look like to you — do you have a target, or is the process itself the goal?<br/>→ What's the thing you keep getting stuck on?</p>
</div>

<div class="prose2">
  <p><strong>06. What's a passion of yours that's really hard to explain to someone who doesn't share it?</strong></p>
</div>
<div class="annotation">
  <p>→ What's the closest you've come to actually conveying it — what worked and what always falls flat?<br/>→ Have you ever met someone who didn't share it but genuinely wanted to understand, and what did that feel like?<br/>→ Is the fact that it's hard to explain part of what you love about it?</p>
</div>

<div class="prose2">
  <p><strong>07. What's something you used to love doing that you've drifted away from — and do you miss it?</strong></p>
</div>
<div class="annotation">
  <p>→ Was the drift gradual or was there a clear moment where it stopped?<br/>→ If you went back to it now, do you think it would feel the same, or would it be different in some hard-to-name way?<br/>→ Is there a reason you haven't gone back — time, logistics, or something more complicated?</p>
</div>

<div class="prose2">
  <p><strong>08. How do you recharge when you've had a really draining week?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it a deliberate ritual or something you just fall into without thinking?<br/>→ Does it work consistently, or do some weeks require something different?<br/>• Is it something you do alone or with other people, and does that feel like a choice or a necessity?</p>
</div>

<div class="prose2">
  <p><strong>09. What's a hobby you picked up during a weird or difficult period in your life that stuck?</strong></p>
</div>
<div class="annotation">
  <p>→ Do you think you would have found it under normal circumstances, or did the situation create the opening?<br/>→ Does the hobby carry any emotional weight now because of when you started it, or has that faded?<br/>→ What did it give you during that period specifically — distraction, focus, community, expression?</p>
</div>

<div class="prose2">
  <p><strong>10. What's something you're weirdly knowledgeable about that has nothing to do with your job?</strong></p>
</div>
<div class="annotation">
  <p>→ Where did it start — one book, one conversation, one late night on the internet?<br/>→ Has it ever actually come in handy in a real situation, or does it mostly live in your head?<br/>→ Is there anyone in your life who knows you're that knowledgeable about it, or does it come as a surprise?</p>
</div>

<div class="prose2">
  <p><strong>11. What's the last thing you got genuinely obsessed with — like really fell down a rabbit hole on?</strong></p>
</div>
<div class="annotation">
  <p>→ What was the entry point — one article, a recommendation, something you stumbled across?<br/>→ At what point did you realize you were actually obsessed rather than just interested?<br/>→ Did the obsession produce anything — a project, a purchase, a new skill — or did it just run its course?</p>
</div>

<div class="prose2">
  <p><strong>12. If someone handed you a Saturday with nothing planned, what would your ideal version look like?</strong></p>
</div>
<div class="annotation">
  <p>→ Is the version you described something you'd actually be able to relax into, or would part of you feel guilty?<br/>→ How close to that ideal do you get on a typical weekend?<br/>→ Is there something you always say you'll do on a free day but never actually do?</p>
</div>

<div class="prose2">
  <p><strong>13. What's a local spot — restaurant, park, neighborhood — that you feel weirdly possessive about?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it busy or is it one of those places that somehow stays quiet despite being great?<br/>→ Do you take people there or do you mostly keep it for yourself?<br/>→ What would it feel like if it changed or closed?</p>
</div>

<div class="prose2">
  <p><strong>14. What's something you collect — even informally or unexpectedly?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it intentional or did you only realize you were collecting once you had a bunch of them?<br/>→ Is there a story behind the one that started it all?<br/>• What do you think it says about you — is there a theme to what draws you in?</p>
</div>

<div class="prose2">
  <p><strong>15. What's a physical activity that clicked for you after years of other things not working?</strong></p>
</div>
<div class="annotation">
  <p>→ What was different about this one — the format, the environment, the social element, something else?<br/>→ Were there things you tried and gave up on that you'd now reconsider, knowing what you know?<br/>→ What does it give you beyond the physical — does it affect your mood, your thinking, your routine?</p>
</div>

<div class="prose2">
  <p><strong>16. What's a podcast, newsletter, or creator you'd recommend to almost anyone?</strong></p>
</div>
<div class="annotation">
  <p>→ What was the first thing you read or listened to that made you realize you'd be a regular?<br/>→ Have you ever actually gotten someone else into it, and did they stick with it?<br/>→ What makes it feel different from the hundred other things competing for your attention?</p>
</div>

<div class="prose2">
  <p><strong>17. What's something you do alone that you'd never want to turn into a group activity?</strong></p>
</div>
<div class="annotation">
  <p>→ Have you ever tried doing it with other people, and how did that go?<br/>→ Is it about the activity itself or about needing that particular time to yourself?<br/>→ Do the people in your life understand why you keep it solo, or do they find it odd?</p>
</div>

<div class="prose2">
  <p><strong>18. What's a pursuit you're currently learning that you're still objectively not good at yet?</strong></p>
</div>
<div class="annotation">
  <p>→ How do you handle the gap between where you are and where you want to be — does it frustrate you or motivate you?<br/>→ Is there a point at which you'd decide it's not worth continuing, or are you committed regardless?<br/>→ What made you start something you knew you'd have to be bad at for a while?</p>
</div>

<div class="divider">§</div>

<div class="prose2">
  <p><strong>IV. TRAVEL</strong></p>
  <p><strong>01. What's a place you've been that genuinely surprised you — not what you expected at all?</strong></p>
</div>
<div class="annotation">
  <p>→ Where did the expectation come from — other people, media, your own imagination?<br/>→ Was the surprise mostly positive, mostly negative, or just genuinely different?<br/>→ Did it change how you do research before you travel somewhere new?</p>
</div>

<div class="prose2">
  <p><strong>02. What's the trip that changed you most, and what actually shifted?</strong></p>
</div>
<div class="annotation">
  <p>→ Was the change something you could articulate immediately, or did it only become clear afterward?<br/>→ Did anyone who knew you before and after notice something was different?<br/>→ Is there something from that trip you're still carrying with you every day?</p>
</div>

<div class="prose2">
  <p><strong>03. What's a place you've been back to more than once, and what keeps pulling you back?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it the place itself, a specific thing within it, or the way you feel when you're there?<br/>→ Do you do the same things each time, or does each visit take on its own shape?<br/>→ Has it changed significantly since the first time, and does that change how it feels?</p>
</div>

<div class="prose2">
  <p><strong>04. What's the most chaotic or unexpected thing that's happened while traveling?</strong></p>
</div>
<div class="annotation">
  <p>→ In the middle of it, was there a moment you thought it would actually ruin everything?<br/>→ Who else was with you, and did you handle it the same way or differently?<br/>→ Is it a story you love telling now, or does it still have some edge to it?</p>
</div>

<div class="prose2">
  <p><strong>05. Where do you want to go next — and what's been stopping you from going?</strong></p>
</div>
<div class="annotation">
  <p>→ How long have you been thinking about this particular place?<br/>→ Is it a practical barrier like time or money, or is there something else making it easy to keep postponing?<br/>• What would actually make you book it — what needs to line up?</p>
</div>

<div class="prose2">
  <p><strong>06. How does your travel style compare to who you were the first time you traveled on your own?</strong></p>
</div>
<div class="annotation">
  <p>→ What's the biggest thing you've stopped caring about that used to feel essential?<br/>→ Is there anything you were more open to then that you've become more rigid about now?<br/>→ If you traveled with the earlier version of yourself, what do you think the friction points would be?</p>
</div>

<div class="prose2">
  <p><strong>07. What's a meal or food you had while traveling that you've spent years trying to recreate?</strong></p>
</div>
<div class="annotation">
  <p>→ What made it so specific — the ingredients, the setting, the person who made it, the moment?<br/>→ Have you ever gotten close, or does it always fall just short?<br/>→ Do you think it could ever actually be recreated, or is the context part of what makes it irreplaceable?</p>
</div>

<div class="prose2">
  <p><strong>08. What's the most off-the-beaten-path place you've been to that most people have never heard of?</strong></p>
</div>
<div class="annotation">
  <p>→ How did you end up there — deliberate planning or a spontaneous detour?<br/>→ What made it worth going somewhere so under the radar?<br/>• Do you share it freely when people ask for recommendations, or do you hold back a little?</p>
</div>

<div class="prose2">
  <p><strong>09. What does your ideal trip actually look like — what makes a trip feel worth it to you?</strong></p>
</div>
<div class="annotation">
  <p>→ Has that definition shifted over the years, or has it been consistent?<br/>→ Where does the ideal trip live in the tension between planning and leaving room for things to happen?<br/>→ What's the one thing that, if it's missing, makes a trip feel like it didn't quite land?</p>
</div>

<div class="prose2">
  <p><strong>10. What's a destination that lived up to all the hype — and one that absolutely didn't?</strong></p>
</div>
<div class="annotation">
  <p>• For the one that delivered — did it do so in the way you expected, or in ways you didn't anticipate?<br/>→ For the one that disappointed — do you think a different trip or timing would have changed your experience?<br/>→ Does a place disappointing you ever make you want to give it a second chance?</p>
</div>

<div class="prose2">
  <p><strong>11. What's something you always wish you had known about a place before you got there?</strong></p>
</div>
<div class="annotation">
  <p>→ Was it practical knowledge or something more cultural or emotional?<br/>• Did anyone try to tell you and you didn't listen, or was it genuinely hard to find out in advance?<br/>→ Do you now share that kind of information with people heading to the same place?</p>
</div>

<div class="prose2">
  <p><strong>12. What's the longest you've spent in one place when traveling, and what was that like?</strong></p>
</div>
<div class="annotation">
  <p>→ When did it stop feeling like travel and start feeling more like living?<br/>→ What did you miss about home, and what did you dread about going back?<br/>→ Did it change your sense of how long you actually need somewhere to feel like you've been there?</p>
</div>

<div class="prose2">
  <p><strong>13. If you could live somewhere for a year — not just visit — where would you actually try?</strong></p>
</div>
<div class="annotation">
  <p>→ What's the honest version of why that place — beyond the surface appeal?<br/>→ What would you need to have in place before you'd actually feel okay doing it?<br/>→ What do you think would be the hardest part of it that you're maybe underestimating?</p>
</div>

<div class="prose2">
  <p><strong>14. What's a cultural difference you encountered abroad that completely reframed how you see something at home?</strong></p>
</div>
<div class="annotation">
  <p>→ Was it a shock in the moment or more of a slow realization?<br/>→ Have you actually changed something about how you live because of it, or is it more of a perspective shift?<br/>→ Is it something you find yourself bringing up when people talk about the way things are done here?</p>
</div>

<div class="prose2">
  <p><strong>15. What's the most meaningful conversation you've had with a stranger while traveling?</strong></p>
</div>
<div class="annotation">
  <p>→ What created the conditions for it — were you both waiting somewhere, sharing a meal, just luck?<br/>→ Did it leave you thinking about something specific, or was it more the feeling of the exchange?<br/>→ Do you think that kind of conversation could have happened at home, or was travel the thing that made it possible?</p>
</div>

<div class="prose2">
  <p><strong>16. What's a place you thought you'd love but left feeling disconnected from?</strong></p>
</div>
<div class="annotation">
  <p>→ Can you trace where the disconnect came from — the place itself, your expectations, your headspace at the time?<br/>→ Have you ever gone back or seriously considered it?<br/>→ Did it shake your confidence in your own taste or sense of what you want from travel?</p>
</div>

<div class="divider">§</div>

<div class="prose2">
  <p><strong>V. RELATIONSHIPS & VALUES</strong></p>
  <p><strong>01. What's something you look for in a friend that's really hard to put into words?</strong></p>
</div>
<div class="annotation">
  <p>→ If you had to point to someone who has it, what would you say they actually do that demonstrates it?<br/>→ Do you think you have that quality yourself, or is it something you're drawn to partly because you lack it?<br/>→ Have you ever lost a friendship and realized afterward that was the thing that was missing?</p>
</div>

<div class="prose2">
  <p><strong>02. What's the quality you most want people to feel when they're around you?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it something you actively work at, or do you think it comes naturally?<br/>→ Is there a gap between the quality you want to project and the one you think actually comes through?<br/>→ Who in your life makes you feel that way, and have you told them?</p>
</div>

<div class="prose2">
  <p><strong>03. How do you know when you trust someone?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it a feeling, a track record, a specific test — or something harder to identify?<br/>→ Have you ever trusted too fast and paid for it, or held back trust so long you regret it?<br/>→ Is the way you build trust with people consistent, or does it vary by relationship?</p>
</div>

<div class="prose2">
  <p><strong>04. What's a belief you held really strongly that someone close to you slowly changed your mind on?</strong></p>
</div>
<div class="annotation">
  <p>→ Was it uncomfortable while it was happening, or did you only realize you'd changed once it was done?<br/>→ Did you tell them they changed your mind, or did the shift happen quietly?<br/>→ What does that say about what kind of people are able to actually move you?</p>
</div>

<div class="prose2">
  <p><strong>05. What does a really good friendship look like to you right now — what does it actually need to have?</strong></p>
</div>
<div class="annotation">
  <p>→ Is what you need from friendship now something you could have asked for at 25, or has it taken time to understand?<br/>→ Are the friendships you currently have matching that picture, or is there a gap?<br/>→ What's the thing you're most willing to compromise on, and what's non-negotiable?</p>
</div>

<div class="prose2">
  <p><strong>06. What's something you've had to forgive — yourself or someone else — that was harder than you expected?</strong></p>
</div>
<div class="annotation">
  <p>→ What made it harder than you anticipated — was it the depth of the hurt, the complexity of the relationship, or something else?<br/>→ What was the thing that eventually made forgiveness possible, even partially?<br/>→ Do you think you've fully forgiven, or is some part of it still sitting there?</p>
</div>

<div class="prose2">
  <p><strong>07. What's a value that feels so central to who you are that you couldn't see yourself changing it?</strong></p>
</div>
<div class="annotation">
  <p>→ Has it ever been genuinely tested — put in a situation where holding it cost you something?<br/>→ Is it something you inherited or something you arrived at on your own?<br/>→ Can you imagine a version of events that would actually change your mind on it?</p>
</div>

<div class="prose2">
  <p><strong>08. What's the best relationship you've ever learned from — romantic or not?</strong></p>
</div>
<div class="annotation">
  <p>→ Was what you learned something you could see in the moment, or only in retrospect?<br/>→ Is the relationship still in your life in some form, or has it ended?<br/>→ What's the one thing you took from it that you've carried into every relationship since?</p>
</div>

<div class="prose2">
  <p><strong>09. How do you handle conflict with people you're close to — do you go quiet, push back, or something else?</strong></p>
</div>
<div class="annotation">
  <p>→ Is that your natural instinct or something you learned, and do you think it actually works?<br/>→ Have you ever wished you handled it differently after the fact?<br/>→ Is there a type of conflict where your usual approach completely breaks down?</p>
</div>

<div class="prose2">
  <p><strong>10. What's something people misread about you when they first meet you?</strong></p>
</div>
<div class="annotation">
  <p>→ Does it bother you, or have you made peace with it?<br/>→ Do you think you give off that signal deliberately in any way, or is it completely accidental?<br/>→ Is there a particular kind of person who gets you right away, and what do you think they see that others miss?</p>
</div>

<div class="prose2">
  <p><strong>11. What's a quality you used to judge in other people that you now catch yourself doing too?</strong></p>
</div>
<div class="annotation">
  <p>→ What was the moment you noticed it in yourself — was it a shock or had you suspected it?<br/>→ Has recognizing it in yourself made you more lenient toward others who do it?<br/>→ Do you think the judgment was really about something else you were working through?</p>
</div>

<div class="prose2">
  <p><strong>12. What does loyalty mean to you in practice — not just as an idea?</strong></p>
</div>
<div class="annotation">
  <p>→ Is there a moment from your own life that defined what loyalty actually looks like?<br/>→ Have you ever had your loyalty tested in a way that surprised you — either by how it felt or what you chose?<br/>→ Do you think loyalty can coexist with honesty when they pull in opposite directions?</p>
</div>

<div class="prose2">
  <p><strong>13. What's the most important thing you've learned from watching someone else's relationship — good or bad?</strong></p>
</div>
<div class="annotation">
  <p>→ Were you observing it consciously at the time or did it only register later?<br/>→ Have you told that person what you saw and what it taught you?<br/>→ Is it something you've actively tried to replicate or actively tried to avoid?</p>
</div>

<div class="prose2">
  <p><strong>14. What's something you need from people that you find hard to ask for directly?</strong></p>
</div>
<div class="annotation">
  <p>→ Do you have a workaround — a way of signaling what you need without saying it outright?<br/>→ Is there one person in your life who gives you that thing without being asked?<br/>→ When did you realize this particular thing was hard for you to ask for?</p>
</div>

<div class="prose2">
  <p><strong>15. What's a boundary you've gotten better at holding that used to make you feel guilty?</strong></p>
</div>
<div class="annotation">
  <p>→ What finally gave you permission to hold it — a conversation, a realization, enough accumulated experience?<br/>→ Is there still a specific type of person or situation where you feel the guilt creeping back in?<br/>→ What would you tell someone who's still at the earlier stage you were at?</p>
</div>

<div class="prose2">
  <p><strong>16. What's a type of person you used to avoid but have come to really appreciate?</strong></p>
</div>
<div class="annotation">
  <p>→ What changed — did you have an experience, or did your own evolution shift what you could handle?<br/>→ Is there a specific person who started to break down that avoidance?<br/>→ Do you think the earlier avoidance was protecting you from something, or was it just a blind spot?</p>
</div>

<div class="prose2">
  <p><strong>17. What's the most generous thing someone has done for you that they probably didn't think was a big deal?</strong></p>
</div>
<div class="annotation">
  <p>→ Have you told them how much it meant, and if not, why not?<br/>→ What made it land the way it did — was it the timing, the person, what it cost them?<br/>→ Has it changed the way you try to show up for other people?</p>
</div>

<div class="prose2">
  <p><strong>18. What does it look like when you feel genuinely seen by someone?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it something they say, something they do, or just a feeling you can't entirely explain?<br/>→ How rare is that experience for you — is it something you get regularly or something you're hungry for?<br/>→ Is there a difference between being seen and being understood, for you?</p>
</div>

<div class="divider">§</div>

<div class="prose2">
  <p><strong>VI. HYPOTHETICALS & FUN</strong></p>
  <p><strong>01. If you could have dinner with anyone — dead or alive — who would you actually pick, and what would you ask them?</strong></p>
</div>
<div class="annotation">
  <p>→ Would you want a one-on-one dinner or would you invite anyone else to the table?<br/>→ What do you think they'd ask you, and how prepared are you for that version of the conversation?<br/>→ Is there something you're hoping they'd say that would actually change something for you?</p>
</div>

<div class="prose2">
  <p><strong>02. If you had to live in a different decade, which one would you actually pick and why?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it the culture, the pace, the aesthetics, or something else drawing you there?<br/>→ What's the thing about that era that people idealize but you'd actually find hard to live with?<br/>→ Would you want to go as yourself or as a version of yourself native to that time?</p>
</div>

<div class="prose2">
  <p><strong>03. If you had to eat one cuisine for the rest of your life, what would save you from losing your mind?</strong></p>
</div>
<div class="annotation">
  <p>→ What's the single dish within that cuisine that you'd rely on most?<br/>→ Is there a cuisine you almost picked — what made you choose the one you did?<br/>→ What's the one thing you'd genuinely mourn giving up?</p>
</div>

<div class="prose2">
  <p><strong>04. If you found out you had six months to do whatever you wanted with unlimited money, what's the first thing you'd actually do?</strong></p>
</div>
<div class="annotation">
  <p>→ Is the first thing practical or purely indulgent?<br/>→ At what point in the six months do you think the novelty would start to feel complicated?<br/>→ What's something you'd want to do that doesn't actually require money — and would you still make time for it?</p>
</div>

<div class="prose2">
  <p><strong>05. What's a skill you'd pick if you could wake up tomorrow being genuinely excellent at it?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it something you've actually tried to learn and struggled with, or purely aspirational?<br/>→ What would be the first thing you'd do with that skill?<br/>→ Do you think part of the appeal is the skill itself, or is it about what having it would open up?</p>
</div>

<div class="prose2">
  <p><strong>06. If you had to swap lives with someone for a week — not a celebrity, someone you actually know — who would it be?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it curiosity about their life, or is there something specific you want to experience from the inside?<br/>→ What do you think would be the part that surprised you most — the thing you didn't anticipate?<br/>→ What do you think they'd find strangest about your life for that same week?</p>
</div>

<div class="prose2">
  <p><strong>07. If you had to describe your personality as a type of weather, what would you be?</strong></p>
</div>
<div class="annotation">
  <p>→ Is that the weather you'd choose to be if you had the option, or just the most honest answer?<br/>→ What weather would people who know you well say you are — do you think they'd match?<br/>→ Is there weather that represents a version of you that only comes out in certain situations?</p>
</div>

<div class="prose2">
  <p><strong>08. What's a historical event you'd want to witness from the crowd — not participate in, just watch?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it to see whether history got it right, or to feel the weight of something that mattered?<br/>→ Is there anyone you'd want to take with you?<br/>→ What do you think you'd feel watching it in real time versus knowing how it turned out?</p>
</div>

<div class="prose2">
  <p><strong>09. If you could have one superpower but it comes with one ridiculous limitation, what's the combo you'd accept?</strong></p>
</div>
<div class="annotation">
  <p>→ Did you pick the power first and work out the limitation, or engineer the combo from both ends?<br/>→ Is there a combo that would actually make the power useless, and did you avoid it deliberately?<br/>→ What's a superpower you'd turn down because no limitation would make it worth it?</p>
</div>

<div class="prose2">
  <p><strong>10. If someone made a documentary about your life right now, what would the title be?</strong></p>
</div>
<div class="annotation">
  <p>→ Would it be a flattering title or a brutally honest one?<br/>→ What's the arc the documentary would follow — what would it build toward?<br/>→ Who would you most want to direct it, and who would you most want kept out of the editing room?</p>
</div>

<div class="prose2">
  <p><strong>11. If you had to teach a class on anything — and you could pick the topic — what would it be?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it something you're already known for, or something most people in your life don't know you know?<br/>→ What age group or type of person would you most want in the room?<br/>→ What's the one thing you'd want students to walk out actually having understood?</p>
</div>

<div class="prose2">
  <p><strong>12. What animal would you be and what would that say about you?</strong></p>
</div>
<div class="annotation">
  <p>→ Is the animal you'd want to be the same as the one you think you actually are?<br/>→ What animal would the people who know you best pick for you?<br/>→ Is there an animal that represents a version of yourself you've grown out of?</p>
</div>

<div class="prose2">
  <p><strong>13. If you could delete one invention from history, what goes first?</strong></p>
</div>
<div class="annotation">
  <p>→ Do you think the world is actually better without it, or do you just want it gone for selfish reasons?<br/>→ What would have filled the gap it left — would something worse have emerged?<br/>→ Is there an invention you almost picked but couldn't bring yourself to delete?</p>
</div>

<div class="prose2">
  <p><strong>14. If you had to move to a different city with no prep time, where would you land?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it somewhere you've been before, or somewhere you've only ever thought about?<br/>→ What would you do in the first 48 hours to start feeling like it was yours?<br/>→ What's the thing about your current city you'd miss more than you'd expect?</p>
</div>

<div class="prose2">
  <p><strong>15. What's the most useless talent you have that you're oddly proud of?</strong></p>
</div>
<div class="annotation">
  <p>→ How did you even discover you could do it?<br/>→ Have you ever been in a situation where it accidentally became useful?<br/>→ Is there a performance quality to it — do you like showing it off, or is it more of a private oddity?</p>
</div>

<div class="prose2">
  <p><strong>16. If you were a main character in a movie, what genre would your life be set in?</strong></p>
</div>
<div class="annotation">
  <p>→ Is that the genre you'd choose, or just the most accurate one?<br/>→ Who would you cast as yourself, and who would play the supporting characters?<br/>→ What's the scene that would end up in the trailer?</p>
</div>

<div class="prose2">
  <p><strong>17. What's something completely mundane you could make sound dramatic if you tried?</strong></p>
</div>
<div class="annotation">
  <p>→ What makes that particular thing easy to dramatize — is there something inherently tense about it?<br/>→ Could you do it right now?<br/>→ Is there someone in your life who already narrates their life this way, and is it annoying or charming?</p>
</div>

<div class="prose2">
  <p><strong>18. If you could only keep three apps on your phone, what survives the cut?</strong></p>
</div>
<div class="annotation">
  <p>→ Was there anything that almost made the cut that you feel slightly guilty about cutting?<br/>→ What does your list say about what you actually use your phone for versus what you tell yourself you use it for?<br/>→ Is there an app you know you'd add back within a week because you underestimated how much you use it?</p>
</div>

<div class="divider">§</div>

<div class="prose2">
  <p><strong>VII. OPINIONS & HOT TAKES</strong></p>
  <p><strong>01. What's a popular opinion you think is mostly just people not thinking hard enough about it?</strong></p>
</div>
<div class="annotation">
  <p>→ When did you start to see through it — was there a specific moment, or did it erode over time?<br/>→ Do you bring it up when it comes up in conversation, or do you let it go?<br/>→ Is there an argument for the popular view that actually gives you pause?</p>
</div>

<div class="prose2">
  <p><strong>02. What's something everyone does that you think is actually kind of overrated?</strong></p>
</div>
<div class="annotation">
  <p>→ Have you ever been convinced to try it again after holding that view, and did it change anything?<br/>→ Do you think people would agree with you privately but wouldn't say so publicly?<br/>→ What do you do instead, and do you think that's actually better or just different?</p>
</div>

<div class="prose2">
  <p><strong>03. What's the most unpopular food opinion you'll defend to your last breath?</strong></p>
</div>
<div class="annotation">
  <p>→ What's the most visceral reaction you've gotten when you shared it?<br/>→ Has anyone ever made a compelling case against it that almost worked?<br/>→ Is there any version of the food done in a specific way that would make you reconsider?</p>
</div>

<div class="prose2">
  <p><strong>04. What's an era of culture — music, film, fashion, whatever — that you think people are too nostalgic for?</strong></p>
</div>
<div class="annotation">
  <p>→ What do you think people are conveniently editing out of their memory of it?<br/>→ Is there something from that era you actually do appreciate, even though you push back on the nostalgia overall?<br/>→ Do you have your own era that you're probably too nostalgic for?</p>
</div>

<div class="prose2">
  <p><strong>05. What's a social norm you think people just follow without questioning?</strong></p>
</div>
<div class="annotation">
  <p>→ Do you follow it yourself, and if so, why?<br/>→ Have you ever tried not following it and seen how people react?<br/>→ What do you think would actually happen if it disappeared?</p>
</div>

<div class="prose2">
  <p><strong>06. What's a genre, art form, or type of entertainment you've come to appreciate more as you've gotten older?</strong></p>
</div>
<div class="annotation">
  <p>→ What changed — you, or your understanding of the thing?<br/>→ Is there something you still can't appreciate that you feel like you probably should by now?<br/>→ What was the first piece of it that cracked you open to it?</p>
</div>

<div class="prose2">
  <p><strong>07. What's something that's widely considered rude that you actually think is reasonable?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it context-dependent or do you think the rule is just wrong in all cases?<br/>→ Have you ever acted on this belief in public and faced pushback?<br/>→ Is there someone in your life who would completely disagree with you on this?</p>
</div>

<div class="prose2">
  <p><strong>08. What's a piece of advice people give constantly that you actually think causes more harm than good?</strong></p>
</div>
<div class="annotation">
  <p>→ Who gave it to you, or where did you first encounter it?<br/>→ What's the specific way it backfires — what does following it actually lead to?<br/>→ What would you replace it with?</p>
</div>

<div class="prose2">
  <p><strong>09. What's a societal value that you think people pay lip service to but don't actually believe?</strong></p>
</div>
<div class="annotation">
  <p>→ Do you think the gap between the stated value and the real one is conscious or unconscious?<br/>→ What gave it away for you — was there a moment that made the hypocrisy visible?<br/>→ Do you hold it yourself in any way, even while seeing the contradiction?</p>
</div>

<div class="prose2">
  <p><strong>10. What's a technology or trend you genuinely think made life worse?</strong></p>
</div>
<div class="annotation">
  <p>→ Did you resist it at first, or did you adopt it before realizing what it was doing?<br/>→ Are you still using it despite thinking it's bad, and does that bother you?<br/>→ What do you think the counterfactual looks like — what would things be like without it?</p>
</div>

<div class="prose2">
  <p><strong>11. What's something in your city or neighborhood that everyone complains about but nobody actually tries to change?</strong></p>
</div>
<div class="annotation">
  <p>→ Have you ever tried to do something about it, even informally?<br/>→ Why do you think the gap between complaining and acting is so wide on this particular issue?<br/>→ Is there someone you know who has actually tried, and what happened?</p>
</div>

<div class="prose2">
  <p><strong>12. What's a genre of music or type of movie that you love but feel like you'd get judged for admitting?</strong></p>
</div>
<div class="annotation">
  <p>→ When did you stop hiding it, or have you?<br/>→ What do you think the judgment is really about — snobbery, taste, something cultural?<br/>→ Have you ever converted anyone else to it?</p>
</div>

<div class="prose2">
  <p><strong>13. What's the best decade of pop culture that most people get wrong?</strong></p>
</div>
<div class="annotation">
  <p>→ What's the specific thing they keep getting wrong about it?<br/>→ What would be the one piece of it you'd make everyone engage with seriously?<br/>→ Is there a decade you think is genuinely overrated that most people would be surprised to hear you say?</p>
</div>

<div class="prose2">
  <p><strong>14. What's something people treat as a personality trait that you think is more of a choice?</strong></p>
</div>
<div class="annotation">
  <p>→ Do you think people genuinely believe it's fixed, or is it a convenient story?<br/>→ Have you ever held that belief about yourself and then proven yourself wrong?<br/>→ Where do you draw the line between something that's truly innate and something that's a pattern someone could change?</p>
</div>

<div class="prose2">
  <p><strong>15. What's a topic people argue about online that you think is way less complicated in real life?</strong></p>
</div>
<div class="annotation">
  <p>→ What is it about the online environment specifically that makes it seem more divisive?<br/>→ Do you ever wade into those arguments, or do you watch from the side?<br/>→ What would it actually take to resolve it — is there a version of the conversation that works?</p>
</div>

<div class="prose2">
  <p><strong>16. What's a cultural import — food, tradition, idea — from another country that you think your country needs more of?</strong></p>
</div>
<div class="annotation">
  <p>→ Where did you first encounter it and what made it stick?<br/>→ What do you think is the actual barrier to it being adopted more widely?<br/>→ Is there something you think your own culture does better than anywhere else?</p>
</div>

<div class="prose2">
  <p><strong>17. What's something you changed your mind on completely in the last five years?</strong></p>
</div>
<div class="annotation">
  <p>→ What was the state of your belief before — was it strong, or more of a default assumption?<br/>→ Was it a single catalyst or an accumulation of things?<br/>→ Are there people in your life who knew the old version of your opinion — have you told them?</p>
</div>

<div class="prose2">
  <p><strong>18. What's a cliché that you think is actually completely true and people just dismiss too quickly?</strong></p>
</div>
<div class="annotation">
  <p>→ Was there a moment you experienced it firsthand and stopped rolling your eyes at it?<br/>→ Why do you think it gets dismissed — is it the phrasing, the packaging, the messenger?<br/>→ Is there a more honest or precise way to say it that would land better?</p>
</div>

<div class="divider">§</div>

<div class="prose2">
  <p><strong>VIII. FUTURE GOALS</strong></p>
  <p><strong>01. What's something you're working toward right now that you're genuinely excited about?</strong></p>
</div>
<div class="annotation">
  <p>→ What does progress look like on a week-to-week basis — how do you know you're moving?<br/>→ What's the version of this that would feel like it worked — what does landing it actually look like?<br/>→ Is there a fear sitting alongside the excitement, and what is it?</p>
</div>

<div class="prose2">
  <p><strong>02. What does the best version of your life look like five years from now — not the ideal, the realistic one?</strong></p>
</div>
<div class="annotation">
  <p>→ What's the single biggest thing that needs to change between now and then for that to happen?<br/>→ Is there something in that picture that you'd have to give up to get it?<br/>→ Who else is in that version of your life — and are they already in it now?</p>
</div>

<div class="prose2">
  <p><strong>03. What's a version of yourself you're actively trying to grow into?</strong></p>
</div>
<div class="annotation">
  <p>→ Where did the image of that version come from — someone you admire, something you read, your own imagination?<br/>→ What's the thing you keep doing that pulls you back toward the old version?<br/>→ How will you know when you've actually become that person?</p>
</div>

<div class="prose2">
  <p><strong>04. What's something you want to get better at this year that isn't career-related at all?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it something you've tried to develop before, or something genuinely new?<br/>→ What would "better" actually look like — is there a concrete measure, or is it more of a feeling?<br/>→ What's the smallest step you could take this week that would count?</p>
</div>

<div class="prose2">
  <p><strong>05. What's a goal you've been putting off that you know you'd regret not starting?</strong></p>
</div>
<div class="annotation">
  <p>→ How long have you been putting it off, and what's the story you've told yourself about why?<br/>→ Is there a version of starting that feels small enough to actually do?<br/>→ What's the cost of another year of waiting — have you actually sat with that?</p>
</div>

<div class="prose2">
  <p><strong>06. What does home feel like to you — and is what you have now close to that?</strong></p>
</div>
<div class="annotation">
  <p>→ Is home a place, a feeling, a set of people, or some combination?<br/>→ Is what you're describing something you've had before and want to recreate, or something you're still searching for?<br/>→ What's the one element that, if you had it, would make where you are now feel more like home?</p>
</div>

<div class="prose2">
  <p><strong>07. What's something you want to do before you turn the next major age milestone?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it something you've been wanting for a long time or something that came into focus recently?<br/>→ What's actually in the way — is it practical, emotional, or just inertia?<br/>→ If you don't do it by that milestone, what happens — is it still something you could do later, or does the window close?</p>
</div>

<div class="prose2">
  <p><strong>08. What's a relationship in your life you want to invest more in going forward?</strong></p>
</div>
<div class="annotation">
  <p>→ Why this relationship — what's the pull toward it?<br/>→ What does investing more actually look like in practice?<br/>→ Is there something that caused the drift, or was it just the default busyness of life?</p>
</div>

<div class="prose2">
  <p><strong>09. What's a habit you've been trying to build that's been harder than you thought?</strong></p>
</div>
<div class="annotation">
  <p>→ What's the specific point at which it keeps breaking down?<br/>→ Have you tried changing the approach, or have you been repeating the same attempt?<br/>→ What does the version of you who has this habit actually look like — what else is different about their life?</p>
</div>

<div class="prose2">
  <p><strong>10. What's something you're saving for — money, energy, or time — and what for?</strong></p>
</div>
<div class="annotation">
  <p>→ Is the goal still what originally motivated the saving, or has it shifted?<br/>→ How will you know when you've saved enough to actually spend it?<br/>→ Is there something you're sacrificing now that you're not sure is worth it?</p>
</div>

<div class="prose2">
  <p><strong>11. What's a risk you're seriously considering taking?</strong></p>
</div>
<div class="annotation">
  <p>→ What's the worst realistic outcome — not the catastrophic one, the actually plausible one?<br/>→ What would you need to know or have in place before you'd feel ready to take it?<br/>→ If you don't take it, what does that version of the future look like?</p>
</div>

<div class="prose2">
  <p><strong>12. What would need to be true about your life for you to feel settled — not necessarily finished, just settled?</strong></p>
</div>
<div class="annotation">
  <p>→ Is settled something you've felt before, even briefly?<br/>→ Are any of those things within your control, or do some of them depend on other people or circumstances?<br/>→ Is part of you afraid of what settled would actually feel like?</p>
</div>

<div class="prose2">
  <p><strong>13. What's a cause or community that you want to contribute more to in the next chapter of your life?</strong></p>
</div>
<div class="annotation">
  <p>→ What draws you to this one specifically — is it personal, principled, or both?<br/>→ Have you been involved in any way already, or is this more of an intention so far?<br/>→ What's the form of contribution that feels most natural to who you are?</p>
</div>

<div class="prose2">
  <p><strong>14. What's a version of success you've quietly stopped wanting, and what replaced it?</strong></p>
</div>
<div class="annotation">
  <p>→ When did you first notice the old version of success starting to feel hollow?<br/>→ Did anyone around you notice the shift, or was it entirely internal?<br/>→ Is the new version of success easier or harder to explain to other people?</p>
</div>

<div class="prose2">
  <p><strong>15. What's something you hope is completely different about your life in ten years?</strong></p>
</div>
<div class="annotation">
  <p>→ Is it something you have real agency over, or does it depend on things outside your control?<br/>→ What would need to happen in the next two or three years to make the ten-year version possible?<br/>→ Is there fear in wanting it to be different — a worry that change comes with its own costs?</p>
</div>

<div class="prose2">
  <p><strong>16. What's one thing you want to be known for that you haven't built yet?</strong></p>
</div>
<div class="annotation">
  <p>→ Who do you want to be known for it by — specific people, a broader community, or is it more internal?<br/>→ What's the distance between where you are now and where you'd need to be for that to be true?<br/>→ Is there anything you're already doing that's a seed of it, even if it doesn't look like much yet?<span class="cursor"></span></p>
</div>

    {
      id: 'ch3',
      num: '03',
      title: 'Carbon Copy',
      subtitle: 'What survives the original.',
      content: `
        <div class="prose2">
          <p>The carbon copy is the honest version. It records what actually happened rather than what you intended to say. The original can be corrected, revised, smoothed over with white paint and a steady hand. The carbon catches only what the keys struck, every hesitation, every typo, every place where the ribbon ran thin and the letters went grey.</p>
          <p>She kept them all. Three drawers of carbon copies, oldest at the back, newest at the front. Eleven years of transmission records. Of what had passed through the machine and into the world, whether the world acknowledged it or not.</p>
        </div>
        <div class="divider">§</div>
        <div class="annotation"><p>All carbon copies are considered primary source material. Handle accordingly.</p></div>
        <div class="prose2">
          <p>The copies were not perfect. That was the point. They were the evidence of contact — of the hammered key and the resistant platen and the thin film of ink passing from one surface to another. A transmission is only real when it leaves a mark somewhere.<span class="cursor"></span></p>
        </div>
      `
    }
  ];

  let activeId = chapters[0].id;
  const sidebar  = document.getElementById('sidebar');
  const chList   = document.getElementById('chapter-list');
  const content  = document.getElementById('content');
  const toggleBtn = document.getElementById('toggleBtn');
  const addBtn   = document.getElementById('addChapterBtn');
  const overlay  = document.getElementById('modal-overlay');
  const cancelBtn = document.getElementById('cancelBtn');
  const confirmBtn = document.getElementById('confirmBtn');
  const titleInput = document.getElementById('ch-title-input');
  const subInput   = document.getElementById('ch-sub-input');
  const countEl   = document.getElementById('chapterCount');

  // ── RENDER ───────────────────────────────────────────────────────────
  function render() {
    // sidebar items
    chList.innerHTML = chapters.map(ch => `
      <div class="chapter-item ${ch.id === activeId ? 'active' : ''}" data-id="${ch.id}" role="button" tabindex="0" aria-current="${ch.id === activeId ? 'page' : 'false'}">
        <span class="ch-num">${ch.num}</span>
        <span class="ch-title">${ch.title}</span>
      </div>
    `).join('');

    // pages
    content.innerHTML = chapters.map(ch => `
      <article class="page ${ch.id === activeId ? 'active' : ''}" id="page-${ch.id}">
        <div class="chapter-heading">
          <div class="ch-eyebrow">Chapter ${ch.num}</div>
          <h1 class="chapter-title">${ch.title}</h1>
          ${ch.subtitle ? `<p class="chapter-subtitle">${ch.subtitle}</p>` : ''}
        </div>
        ${ch.content}
      </article>
    `).join('');

    countEl.textContent = `${chapters.length} ch`;

    // re-bind chapter click
    chList.querySelectorAll('.chapter-item').forEach(el => {
      el.addEventListener('click', () => navigate(el.dataset.id));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') navigate(el.dataset.id); });
    });
  }

  function navigate(id) {
    activeId = id;
    render();
    content.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── SIDEBAR TOGGLE ────────────────────────────────────────────────────
  toggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
    toggleBtn.setAttribute('aria-expanded', !sidebar.classList.contains('collapsed'));
  });

  // ── ADD CHAPTER MODAL ─────────────────────────────────────────────────
  function openModal() {
    titleInput.value = '';
    subInput.value = '';
    overlay.classList.add('open');
    setTimeout(() => titleInput.focus(), 50);
  }

  function closeModal() {
    overlay.classList.remove('open');
  }

  function addChapter() {
    const t = titleInput.value.trim();
    if (!t) { titleInput.focus(); return; }
    const num = String(chapters.length + 1).padStart(2, '0');
    const id  = 'ch' + Date.now();
    chapters.push({
      id,
      num,
      title: t,
      subtitle: subInput.value.trim() || '',
      content: `
        <div class="prose2">
          <p>This chapter is yet to be written. The page waits.<span class="cursor"></span></p>
        </div>
      `
    });
    activeId = id;
    render();
    closeModal();
    content.scrollTo({ top: 0, behavior: 'smooth' });
  }

  addBtn.addEventListener('click', openModal);
  cancelBtn.addEventListener('click', closeModal);
  confirmBtn.addEventListener('click', addChapter);
  titleInput.addEventListener('keydown', e => { if (e.key === 'Enter') addChapter(); });
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── INIT ─────────────────────────────────────────────────────────────
  render();
</script>
